<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LETUGGS - Smooth Cosmic Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; overflow: hidden; font-family: 'Orbitron', sans-serif; }
        body { background-color: #030305; color: #fff; width: 100vw; height: 100vh; }
        
        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: contain; z-index: 1; background: radial-gradient(circle at center, #0a0a15 0%, #000 100%);
        }

        /* --- UI --- */
        #uiLayer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        #leaderboard {
            position: absolute; top: 20px; right: 20px;
            background: rgba(10, 10, 25, 0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.1); padding: 20px; border-radius: 12px;
        }
        #leaderboard h2 { font-size: 14px; color: #0ff; margin-bottom: 12px; letter-spacing: 2px; }
        #leaderList { list-style: none; font-size: 14px; }
        #leaderList li { margin-bottom: 8px; display: flex; justify-content: space-between; gap: 30px;}

        #skillsPanel { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }
        .skill {
            width: 65px; height: 65px; background: rgba(15, 15, 30, 0.9);
            border: 2px solid #222; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; overflow: hidden; transition: 0.2s;
        }
        .skill.ready { border-color: #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .skill .cd-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(255, 0, 50, 0.3); transition: height 0.1s linear; }
        .skill .key { font-size: 18px; font-weight: bold; color: #fff; z-index: 2; text-shadow: 0 0 5px #000;}
        .skill .name { font-size: 10px; color: #0ff; z-index: 2; margin-top: 5px; text-transform: uppercase;}

        #loginScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; pointer-events: auto; backdrop-filter: blur(10px);
        }
        #loginScreen h1 { font-size: 90px; font-weight: 900; letter-spacing: 10px; color: #fff; text-shadow: 0 0 40px #0ff, 0 0 10px #b026ff; margin-bottom: 10px; }
        #loginScreen p { color: #aaa; margin-bottom: 50px; letter-spacing: 3px; }
        #nickname { padding: 15px 30px; font-size: 20px; width: 350px; background: rgba(255, 255, 255, 0.05); border: 2px solid #333; color: #fff; border-radius: 10px; text-align: center; margin-bottom: 25px; outline: none; transition: 0.3s;}
        #nickname:focus { border-color: #0ff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }
        #joinBtn { padding: 15px 50px; font-size: 20px; font-weight: bold; background: #0ff; color: #000; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        #joinBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 255, 255, 0.4); }
        
        #killFeed { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); font-size: 20px; color: #fff; text-shadow: 0 0 15px #f00; opacity: 0; transition: 0.3s; font-weight: bold;}
    </style>
</head>
<body>
    <div id="loginScreen">
        <h1>LETUGGS</h1>
        <p>SMOOTH GRAVITY ARENA</p>
        <input type="text" id="nickname" placeholder="Nick Gir..." maxlength="12" autocomplete="off">
        <button id="joinBtn">ARENAYA GİR</button>
    </div>

    <div id="uiLayer" style="display: none;">
        <div id="leaderboard"><h2>Sıralama</h2><ul id="leaderList"></ul></div>
        <div id="killFeed"></div>
        <div id="skillsPanel">
            <div class="skill" id="skill-L"><div class="cd-fill" id="cd-L"></div><div class="key">S.Tık</div><div class="name">Kement</div></div>
            <div class="skill" id="skill-R"><div class="cd-fill" id="cd-R"></div><div class="key">Sağ</div><div class="name">Nova</div></div>
            <div class="skill" id="skill-Space"><div class="cd-fill" id="cd-Space"></div><div class="key">Space</div><div class="name">Dash</div></div>
            <div class="skill" id="skill-Shift"><div class="cd-fill" id="cd-Shift"></div><div class="key">Shift</div><div class="name">Faz</div></div>
            <div class="skill" id="skill-E"><div class="cd-fill" id="cd-E"></div><div class="key">E</div><div class="name">Karadelik</div></div>
        </div>
    </div>

    <!-- 1920x1080 Sabit Render Alanı -->
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script>
/**
 * LETUGGS - DELTA-TIME FİZİK MOTORU
 * Tamamen baştan yazılmış, "oturaklı", vektörel akıcılığa sahip çekirdek.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 1920;
const HEIGHT = 1080;
const CENTER_X = WIDTH / 2;
const CENTER_Y = HEIGHT / 2;
const ARENA_RADIUS = 900; 

// Ağ Ayarları
const channel = new BroadcastChannel('letuggs_smooth_net');
const NETWORK_TICK_RATE = 30; // Saniyede 30 paket

// Delta Time Değişkenleri
let lastTime = performance.now();
let dt = 0;
let hitstopTimer = 0;
let shakeTimer = 0;

// Oyuncu Durumu
let myId = Math.random().toString(36).substr(2, 9);
let me = {
    id: myId, name: "Pilot",
    x: CENTER_X, y: CENTER_Y,
    vx: 0, vy: 0,
    radius: 20, mass: 1, // Kütle (Score ile artar)
    color: `hsl(${Math.random() * 360}, 100%, 65%)`,
    score: 0, isDead: false, isGhost: false,
    
    // Smooth Kement Sistemi
    tether: { 
        active: false, 
        isProjectile: false, 
        px: 0, py: 0, pvx: 0, pvy: 0, // Mermi koordinatları
        attachedId: null, 
        life: 0 
    }
};

let players = {};
let particles = [];
let blackHoles = [];
let trails = {};
let keys = {};
let mouseX = CENTER_X, mouseY = CENTER_Y;
let isMouseDown = false;

// Yetenekler
const skills = {
    tether: { cd: 1.0, timer: 0 },
    nova: { cd: 6.0, timer: 0 },
    dash: { cd: 4.0, timer: 0 },
    ghost: { cd: 10.0, timer: 0 },
    bhole: { cd: 20.0, timer: 0 }
};

// --- GİRDİ YÖNETİMİ (Kusursuz Mouse Tespiti) ---
window.addEventListener('resize', calculateMouseScale);
let scaleX = 1, scaleY = 1, rectLeft = 0, rectTop = 0;
function calculateMouseScale() {
    const rect = canvas.getBoundingClientRect();
    scaleX = canvas.width / rect.width;
    scaleY = canvas.height / rect.height;
    rectLeft = rect.left;
    rectTop = rect.top;
}

canvas.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX - rectLeft) * scaleX;
    mouseY = (e.clientY - rectTop) * scaleY;
});

window.addEventListener('keydown', e => { keys[e.code] = true; handleInput(e.code); });
window.addEventListener('keyup', e => keys[e.code] = false);
canvas.addEventListener('mousedown', e => { 
    if(e.button === 0) { isMouseDown = true; handleInput('MouseLeftDown'); }
    if(e.button === 2) handleInput('MouseRight'); 
});
canvas.addEventListener('mouseup', e => { 
    if(e.button === 0) { isMouseDown = false; handleInput('MouseLeftUp'); }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('joinBtn').addEventListener('click', () => {
    let nick = document.getElementById('nickname').value.trim();
    if(nick) me.name = nick.substring(0, 12);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('uiLayer').style.display = 'block';
    
    calculateMouseScale();
    setInterval(sendNetworkState, 1000 / NETWORK_TICK_RATE);
    requestAnimationFrame(gameLoop);
});

// --- FİZİK VE MATEMATİK YARDIMCILARI ---
function dist(x1, y1, x2, y2) { return Math.max(Math.sqrt((x2-x1)**2 + (y2-y1)**2), 0.1); }
function normalize(x, y) { let l = dist(0,0,x,y); return {x: x/l, y: y/l}; }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

// --- YETENEK KULLANIMLARI ---
function handleInput(act) {
    if(me.isDead || me.isGhost) return;
    
    let dirX = mouseX - me.x;
    let dirY = mouseY - me.y;
    let dir = normalize(dirX, dirY);

    // KEMENT AT (Mermi gibi gider)
    if(act === 'MouseLeftDown' && skills.tether.timer <= 0) {
        me.tether.active = true;
        me.tether.isProjectile = true;
        me.tether.attachedId = null;
        me.tether.px = me.x;
        me.tether.py = me.y;
        me.tether.pvx = dir.x * 2000; // Saniyede 2000px hız
        me.tether.pvy = dir.y * 2000;
        me.tether.life = 0.5; // Yarım saniye uçar
    }

    // KEMENTİ BIRAK
    if(act === 'MouseLeftUp' && me.tether.active) {
        me.tether.active = false;
        me.tether.isProjectile = false;
        me.tether.attachedId = null;
        skills.tether.timer = skills.tether.cd; // Koptuğunda CD başlar
    }

    // NOVA (Sağ Tık)
    if(act === 'MouseRight' && skills.nova.timer <= 0) {
        skills.nova.timer = skills.nova.cd;
        createParticles(me.x, me.y, '#0ff', 40, 1500);
        triggerShake(0.2);
        
        Object.values(players).forEach(p => {
            if(p.id === myId || p.isDead || p.isGhost) return;
            let d = dist(me.x, me.y, p.x, p.y);
            if(d < 400) {
                let pushDir = normalize(p.x - me.x, p.y - me.y);
                let force = (400 - d) * 5; 
                channel.postMessage({ type: 'impulse', targetId: p.id, vx: pushDir.x * force, vy: pushDir.y * force, attacker: me.name });
            }
        });
    }

    // DASH (Space) - Kinetik Patlama
    if(act === 'Space' && skills.dash.timer <= 0) {
        skills.dash.timer = skills.dash.cd;
        
        // Eğer hareket tuşlarına basıyorsa o yöne, basmıyorsa fareye doğru atıl
        let dashDir = {x: 0, y: 0};
        if(keys['KeyW']) dashDir.y -= 1;
        if(keys['KeyS']) dashDir.y += 1;
        if(keys['KeyA']) dashDir.x -= 1;
        if(keys['KeyD']) dashDir.x += 1;
        
        if(dashDir.x === 0 && dashDir.y === 0) dashDir = dir;
        else dashDir = normalize(dashDir.x, dashDir.y);

        me.vx += dashDir.x * 1500;
        me.vy += dashDir.y * 1500;
        createParticles(me.x, me.y, '#fff', 20, 800);
        triggerShake(0.15);
    }

    // FAZ / GHOST (Shift)
    if((act === 'ShiftLeft' || act === 'ShiftRight') && skills.ghost.timer <= 0) {
        skills.ghost.timer = skills.ghost.cd;
        me.isGhost = true;
        me.tether.active = false; // Kementi kopar
        setTimeout(() => me.isGhost = false, 1500);
    }

    // KARA DELİK (E)
    if(act === 'KeyE' && skills.bhole.timer <= 0) {
        skills.bhole.timer = skills.bhole.cd;
        let bh = { x: mouseX, y: mouseY, life: 4.0 };
        blackHoles.push(bh);
        channel.postMessage({ type: 'blackhole', x: bh.x, y: bh.y });
        triggerShake(0.3);
    }
}

// --- ANA FİZİK MOTORU (Her Karede Çalışır) ---
function updatePhysics() {
    if(me.isDead) return;

    // 1. OYUNCU HAREKETİ (İvme / Acceleration)
    let acc = me.isGhost ? 3000 : 2500; // Faz modunda daha hızlı
    let ax = 0, ay = 0;
    
    if(keys['KeyW']) ay -= 1;
    if(keys['KeyS']) ay += 1;
    if(keys['KeyA']) ax -= 1;
    if(keys['KeyD']) ax += 1;
    
    if(ax !== 0 || ay !== 0) {
        let inputDir = normalize(ax, ay);
        me.vx += inputDir.x * acc * dt;
        me.vy += inputDir.y * acc * dt;
    }

    // 2. SÜRTÜNME (Drag/Friction) - Akıcı bir duruş sağlar
    let friction = 4.0; // Sayı büyüdükçe daha çabuk durur
    me.vx -= me.vx * friction * dt;
    me.vy -= me.vy * friction * dt;

    // 3. KEMENT FİZİĞİ (Yay ve Merkezkaç)
    if(me.tether.active) {
        if(me.tether.isProjectile) {
            // Mermi ilerliyor
            me.tether.px += me.tether.pvx * dt;
            me.tether.py += me.tether.pvy * dt;
            me.tether.life -= dt;
            
            // Çarpışma kontrolü
            Object.values(players).forEach(p => {
                if(p.id === myId || p.isDead || p.isGhost) return;
                let d = dist(me.tether.px, me.tether.py, p.targetX || p.x, p.targetY || p.y);
                if(d < p.radius + 10) {
                    me.tether.isProjectile = false; // Vurdu
                    me.tether.attachedId = p.id;
                    createParticles(me.tether.px, me.tether.py, '#0ff', 15, 500);
                    triggerShake(0.1);
                }
            });

            if(me.tether.life <= 0) me.tether.active = false; // Kaçırdı
        } 
        else if (me.tether.attachedId) {
            // BAĞLANDIK! (Hooke Yasası ile Elastik Çekim)
            let target = players[me.tether.attachedId];
            if(target && !target.isDead && !target.isGhost && isMouseDown) {
                let tx = target.targetX || target.x;
                let ty = target.targetY || target.y;
                let d = dist(me.x, me.y, tx, ty);
                
                let springConstant = 8.0; // Yansıma Sertliği
                let restLength = 100; // Bu mesafeye kadar çekmez, ötesinde asılır
                
                if(d > restLength) {
                    let force = (d - restLength) * springConstant;
                    let dir = normalize(tx - me.x, ty - me.y);
                    
                    // Kütle oranlarına göre kuvveti böl
                    let totalMass = me.mass + target.mass;
                    let myRatio = target.mass / totalMass;
                    let targetRatio = me.mass / totalMass;

                    // Bize uygulanan çekim
                    me.vx += dir.x * force * myRatio * dt;
                    me.vy += dir.y * force * myRatio * dt;

                    // Karşıya uygulanan çekim (Ağ üzerinden yolla)
                    channel.postMessage({ 
                        type: 'spring_pull', targetId: target.id, 
                        vx: -dir.x * force * targetRatio * dt, 
                        vy: -dir.y * force * targetRatio * dt,
                        attacker: me.name 
                    });
                }
            } else {
                me.tether.active = false; // Rakip öldü veya fareyi bıraktık
            }
        }
    }

    // 4. KARADELİK ÇEKİMİ
    blackHoles.forEach(bh => {
        if(me.isGhost) return;
        let d = dist(me.x, me.y, bh.x, bh.y);
        if(d < 600) {
            let pullDir = normalize(bh.x - me.x, bh.y - me.y);
            // Ters kare yasasına benzer, yaklaştıkça artan çekim
            let pullForce = (600 - d) * 3; 
            me.vx += pullDir.x * pullForce * dt;
            me.vy += pullDir.y * pullForce * dt;
        }
    });

    // 5. BİLARDO ÇARPIŞMALARI (Elastic Collision)
    if(!me.isGhost) {
        Object.values(players).forEach(p => {
            if(p.id === myId || p.isDead || p.isGhost) return;
            let px = p.targetX || p.x;
            let py = p.targetY || p.y;
            let d = dist(me.x, me.y, px, py);
            let minDist = me.radius + p.radius;
            
            if(d < minDist) {
                // Önce iç içe geçmeyi çöz (Position Correction)
                let n = normalize(me.x - px, me.y - py); // Çarpışma Normali
                let overlap = minDist - d;
                me.x += n.x * (overlap / 2);
                me.y += n.y * (overlap / 2);

                // Momentum Transferi Hesapla (Eğer hızlıysak)
                let speed = dist(0, 0, me.vx, me.vy);
                if(speed > 600) { // Dash veya hızlı savrulma anında çarptıysak
                    let impulse = speed * 0.8; // Hızımızın %80'ini karşıya aktar
                    channel.postMessage({ 
                        type: 'impulse', targetId: p.id, 
                        vx: -n.x * impulse, vy: -n.y * impulse, 
                        attacker: me.name 
                    });
                    
                    // Kendimiz sekme yaşarız (enerji kaybı)
                    me.vx *= -0.3;
                    me.vy *= -0.3;
                    
                    triggerShake(0.3);
                    hitstopTimer = 0.05; // 50ms Hitstop (Vuruş Duraksaması)
                }
            }
        });
    }

    // 6. POZİSYON GÜNCELLEME
    me.x += me.vx * dt;
    me.y += me.vy * dt;

    // 7. ÖLÜM KONTROLÜ (Sınır dışına çıkmak)
    if(dist(me.x, me.y, CENTER_X, CENTER_Y) > ARENA_RADIUS) {
        die();
    }
}

function die() {
    me.isDead = true;
    me.tether.active = false;
    createParticles(me.x, me.y, me.color, 100, 2000);
    triggerShake(0.6);
    hitstopTimer = 0.1; // Uzun Hitstop

    channel.postMessage({ type: 'kill', victim: me.name }); // Sunucuya öldüğümüzü bildir

    setTimeout(() => {
        me.x = CENTER_X + (Math.random()*200 - 100);
        me.y = CENTER_Y + (Math.random()*200 - 100);
        me.vx = 0; me.vy = 0;
        me.score = Math.max(0, me.score - 1);
        me.mass = 1 + (me.score * 0.2);
        me.radius = 20 + (me.score * 2);
        me.isDead = false;
        me.isGhost = true; // Spawn koruması
        setTimeout(() => me.isGhost = false, 2000);
    }, 2500);
}

// --- AĞ (NETWORK) YÖNETİMİ ---
function sendNetworkState() {
    if(me.isDead) return;
    channel.postMessage({ type: 'state', player: me });
}

channel.onmessage = (e) => {
    let msg = e.data;
    if(msg.type === 'state') {
        let pId = msg.player.id;
        if(!players[pId]) players[pId] = msg.player;
        
        // Pürüzsüz Lerp için Hedef (Target) belirleme
        players[pId].targetX = msg.player.x;
        players[pId].targetY = msg.player.y;
        players[pId].isGhost = msg.player.isGhost;
        players[pId].isDead = msg.player.isDead;
        players[pId].score = msg.player.score;
        players[pId].radius = msg.player.radius;
        players[pId].tether = msg.player.tether;
    }
    else if(msg.type === 'impulse' && msg.targetId === myId && !me.isGhost) {
        me.vx += msg.vx; me.vy += msg.vy; 
        triggerShake(0.2);
    }
    else if(msg.type === 'spring_pull' && msg.targetId === myId && !me.isGhost) {
        me.vx += msg.vx; me.vy += msg.vy; 
    }
    else if(msg.type === 'blackhole') {
        blackHoles.push({ x: msg.x, y: msg.y, life: 4.0 });
        triggerShake(0.2);
    }
    else if(msg.type === 'kill') {
        showKillFeed(`BİRİLERİ HİÇLİĞE KARIŞTI: ${msg.victim}`);
        triggerShake(0.4);
    }
};

// --- GÖRSEL EFEKTLER (JUICE) ---
function triggerShake(intensity) { shakeTimer = intensity; }

function createParticles(x, y, color, count, speed) {
    for(let i=0; i<count; i++) {
        let a = Math.random() * Math.PI * 2;
        let s = Math.random() * speed;
        particles.push({
            x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
            color: color, life: 1.0, maxLife: 1.0, size: Math.random()*5 + 2
        });
    }
}

function showKillFeed(text) {
    let el = document.getElementById('killFeed');
    el.innerText = text; el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 3000);
}

// --- ANA OYUN DÖNGÜSÜ (RENDER + LÖP LÖP FİZİK) ---
function gameLoop(time) {
    // DT Hesaplama (Sınırlandırılmış, sekme/donma önleyici)
    dt = (time - lastTime) / 1000;
    if(dt > 0.1) dt = 0.1; 
    lastTime = time;

    // HITSTOP: Vuruş hissi için fiziği dondur ama çizimi devam ettir
    if(hitstopTimer > 0) {
        hitstopTimer -= dt;
    } else {
        updatePhysics();
    }
    
    updateCooldowns();

    // EKRAN SARSINTISI (Screen Shake)
    ctx.save();
    if(shakeTimer > 0) {
        let mag = shakeTimer * 50;
        ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
        shakeTimer -= dt;
    }

    // ARKA PLAN
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    let grad = ctx.createRadialGradient(CENTER_X, CENTER_Y, ARENA_RADIUS - 300, CENTER_X, CENTER_Y, ARENA_RADIUS);
    grad.addColorStop(0, "rgba(5, 5, 15, 0)");
    grad.addColorStop(0.9, "rgba(80, 0, 30, 0.4)");
    grad.addColorStop(1, "rgba(0, 0, 0, 0.95)");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // KILAVUZ ÇİZGİLERİ
    ctx.strokeStyle = "rgba(255, 255, 255, 0.03)"; ctx.lineWidth = 1;
    for(let i = 0; i < WIDTH; i+=100) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, HEIGHT); ctx.stroke();
    }
    for(let i = 0; i < HEIGHT; i+=100) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WIDTH, i); ctx.stroke();
    }

    // KARA DELİKLER
    for(let i = blackHoles.length - 1; i >= 0; i--) {
        let bh = blackHoles[i]; bh.life -= dt;
        if(bh.life <= 0) { blackHoles.splice(i, 1); continue; }
        
        ctx.beginPath(); ctx.arc(bh.x, bh.y, 25 + Math.random()*10, 0, Math.PI*2);
        ctx.fillStyle = "#000"; ctx.shadowColor = "#b026ff"; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
    }

    // OYUNCULAR (Lerp ve Çizim)
    let allPlayers = [me, ...Object.values(players)];
    allPlayers.forEach(p => {
        if(p.isDead) return;

        // Ağ üzerinden gelenleri yumuşat (Interpolation)
        if(p.id !== myId && p.targetX !== undefined) {
            p.x += (p.targetX - p.x) * 10 * dt;
            p.y += (p.targetY - p.y) * 10 * dt;
        }

        // KEMENT (TETHER) ÇİZİMİ
        if(p.tether && p.tether.active) {
            ctx.beginPath(); ctx.moveTo(p.x, p.y);
            let tx, ty;
            if(p.tether.isProjectile) { tx = p.tether.px; ty = p.tether.py; }
            else if (p.tether.attachedId && players[p.tether.attachedId]) {
                tx = players[p.tether.attachedId].x; ty = players[p.tether.attachedId].y;
            } else if (p.tether.attachedId === myId) {
                tx = me.x; ty = me.y;
            }
            if(tx && ty) {
                ctx.lineTo(tx, ty);
                ctx.strokeStyle = p.tether.attachedId ? "#ff00ff" : "#00ffff"; // Tuttuysa pembe, boşsa mavi
                ctx.lineWidth = p.tether.attachedId ? 6 : 3;
                ctx.stroke();
                
                // Kement Ucu
                ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI*2);
                ctx.fillStyle = "#fff"; ctx.fill();
            }
        }

        // HAREKET İZİ (TRAIL)
        if(!trails[p.id]) trails[p.id] = [];
        trails[p.id].unshift({x: p.x, y: p.y});
        if(trails[p.id].length > 15) trails[p.id].pop();
        
        ctx.beginPath();
        for(let i=0; i<trails[p.id].length; i++) ctx.lineTo(trails[p.id][i].x, trails[p.id][i].y);
        ctx.strokeStyle = p.color; ctx.lineWidth = p.radius * 0.6; ctx.lineCap = "round"; 
        ctx.globalAlpha = 0.2; ctx.stroke(); ctx.globalAlpha = 1.0;

        // OYUNCU ÇEKİRDEĞİ (CORE)
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fillStyle = p.isGhost ? "rgba(255,255,255,0.2)" : p.color;
        ctx.shadowColor = p.color; ctx.shadowBlur = p.isGhost ? 0 : 20; ctx.fill(); ctx.shadowBlur = 0;
        
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px Orbitron"; ctx.textAlign = "center";
        ctx.fillText(p.name, p.x, p.y - p.radius - 10);
    });

    // PARTİKÜLLER
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; 
        p.x += p.vx * dt; p.y += p.vy * dt; 
        p.vx *= 0.95; p.vy *= 0.95; // Hava sürtünmesi
        p.life -= dt;
        if(p.life <= 0) { particles.splice(i, 1); continue; }
        
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0;
    }

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

// --- YARDIMCI GÜNCELLEMELER ---
function updateCooldowns() {
    ['tether', 'nova', 'dash', 'ghost', 'bhole'].forEach(key => {
        if(skills[key].timer > 0) skills[key].timer -= dt;
    });

    document.getElementById('cd-L').style.height = (skills.tether.timer / skills.tether.cd) * 100 + "%";
    document.getElementById('skill-L').className = skills.tether.timer <= 0 ? "skill ready" : "skill";
    
    document.getElementById('cd-R').style.height = (skills.nova.timer / skills.nova.cd) * 100 + "%";
    document.getElementById('skill-R').className = skills.nova.timer <= 0 ? "skill ready" : "skill";
    
    document.getElementById('cd-Space').style.height = (skills.dash.timer / skills.dash.cd) * 100 + "%";
    document.getElementById('skill-Space').className = skills.dash.timer <= 0 ? "skill ready" : "skill";
    
    document.getElementById('cd-Shift').style.height = (skills.ghost.timer / skills.ghost.cd) * 100 + "%";
    document.getElementById('skill-Shift').className = skills.ghost.timer <= 0 ? "skill ready" : "skill";
    
    document.getElementById('cd-E').style.height = (skills.bhole.timer / skills.bhole.cd) * 100 + "%";
    document.getElementById('skill-E').className = skills.bhole.timer <= 0 ? "skill ready" : "skill";
}

setInterval(() => {
    let sorted = Object.values(players).concat(me).sort((a,b) => b.score - a.score);
    let html = "";
    sorted.slice(0, 5).forEach((p, index) => { 
        html += `<li><span>${index+1}. <span style="color:${p.color}">${p.name}</span></span> <span>${p.score} Kill</span></li>`; 
    });
    document.getElementById('leaderList').innerHTML = html;
}, 1000);
