<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LETUGGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #050510; color: white; font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        
        /* Glassmorphism UI */
        .glass {
            background: rgba(10, 10, 25, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }
        
        /* Lobby */
        #lobby {
            position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a1a3a 0%, #050510 100%);
            z-index: 50;
        }
        .lobby-box { padding: 3rem; border-radius: 1.5rem; text-align: center; width: 90%; max-width: 450px; }
        
        .title-glow {
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.8), 0 0 40px rgba(217, 70, 239, 0.5);
        }
        
        input[type="text"] {
            width: 100%; padding: 1rem; margin: 1.5rem 0; border-radius: 0.75rem;
            border: 1px solid rgba(139, 92, 246, 0.5); background: rgba(0, 0, 0, 0.3);
            color: white; font-size: 1.2rem; outline: none; text-align: center;
            transition: all 0.3s;
        }
        input[type="text"]:focus { border-color: #d946ef; box-shadow: 0 0 15px rgba(217, 70, 239, 0.3); }
        
        button.btn-play {
            width: 100%; padding: 1rem; border-radius: 0.75rem; font-size: 1.2rem; font-weight: 800;
            background: linear-gradient(90deg, #8b5cf6, #d946ef); color: white;
            border: none; cursor: pointer; transition: transform 0.2s, filter 0.2s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        button.btn-play:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.2); }

        /* Game HUD */
        #hud {
            position: absolute; inset: 0; pointer-events: none; z-index: 10; display: none;
            padding: 1.5rem; flex-direction: column; justify-content: space-between;
        }
        
        .cooldown-bar {
            width: 150px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 4px;
        }
        .cooldown-fill { height: 100%; transition: width 0.1s linear; }
        
        /* Leaderboard */
        #leaderboard {
            min-width: 250px; padding: 1rem; border-radius: 1rem;
        }
        .lb-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="lobby-box glass">
            <h1 class="text-6xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-violet-500 to-fuchsia-500 title-glow mb-2">LETUGGS</h1>
            <p class="text-gray-400 font-medium mb-6">Massive Multiplayer Physics Brawler</p>
            <input type="text" id="nickname" placeholder="Enter Nickname" maxlength="12" autocomplete="off" />
            <button class="btn-play" id="btn-join">Enter Void</button>
            <div class="mt-6 text-sm text-gray-500 text-left bg-black/30 p-4 rounded-lg">
                <p><b>WASD:</b> Move (Higher mass = slower)</p>
                <p><b>HOLD LMB:</b> Charge & Throw Lasso</p>
                <p><b>SPACE:</b> Kinetic Dash (Bumps & Stuns!)</p>
                <p><b>RMB:</b> Ground Pound Shockwave</p>
            </div>
        </div>
    </div>

    <div id="hud">
        <div class="flex justify-between items-start w-full">
            <div class="glass p-4 rounded-xl">
                <h1 class="text-3xl font-black italic text-fuchsia-400 tracking-wider">LETUGGS</h1>
                <p class="text-xs text-gray-300 mt-1">Survive the edge. Gain Mass. Dominate.</p>
            </div>
            
            <div id="leaderboard" class="glass">
                <h2 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-widest text-center">Top Masses</h2>
                <div id="lb-content"></div>
            </div>
        </div>

        <div class="flex justify-center w-full pb-4">
            <div class="glass p-4 rounded-2xl flex gap-8 pointer-events-auto">
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-gray-300 uppercase">Dash (Space)</span>
                    <div class="cooldown-bar"><div id="cd-dash" class="cooldown-fill bg-cyan-400" style="width: 100%;"></div></div>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-gray-300 uppercase">Shockwave (RMB)</span>
                    <div class="cooldown-bar"><div id="cd-shock" class="cooldown-fill bg-fuchsia-500" style="width: 100%;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'letuggs-arena';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo" };
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) { console.error("Firebase init:", e); }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lobby = document.getElementById('lobby');
        const hud = document.getElementById('hud');
        
        const ARENA_RADIUS = 1200;
        const BASE_RADIUS = 20;
        const RADIUS_PER_SCORE = 4;
        const BASE_MASS = 1.0;
        const MASS_PER_SCORE = 0.2;
        
        const BASE_ACCEL = 1000; // Slower deliberate movement
        const FRICTION = 0.93; // High momentum slide
        
        // Abilities
        const DASH_FORCE = 2500;
        const DASH_COOLDOWN = 4.0; // seconds
        
        const SHOCKWAVE_RANGE = 450;
        const SHOCKWAVE_FORCE = 2500;
        const SHOCKWAVE_COOLDOWN = 8.0;
        
        const MAX_CHARGE_TIME = 1.2;
        const BASE_HOOK_SPEED = 800;
        const MAX_HOOK_SPEED = 2200;
        const BASE_HOOK_RANGE = 400;
        const MAX_HOOK_RANGE = 1000;
        
        const STUN_DURATION = 1.5;
        const SYNC_RATE = 100; // 10Hz to save quota

        // Global State
        let width, height;
        let camX = 0, camY = 0;
        let targetCamX = 0, targetCamY = 0;
        let shake = 0;
        let mouseX = 0, mouseY = 0;
        
        let currentUser = null;
        let isPlaying = false;
        let players = {};
        let particles = [];
        let shockwaves = [];
        
        let lastTime = performance.now();
        let lastSyncTime = 0;

        const pState = {
            id: '', name: 'Player', color: '#fff',
            x: 0, y: 0, vx: 0, vy: 0,
            score: 0, mass: BASE_MASS, radius: BASE_RADIUS,
            trail: [], // Local visual only
            
            // Input/Actions
            isCharging: false, chargeTime: 0,
            isStunned: false, stunTimer: 0,
            dashTimer: 0, shockwaveTimer: 0,
            
            // Slamming logic
            isSlamming: false, slamTimer: 0, slamZ: 0, // Z is for jump visual
            lastShockwaveId: 0,

            // Hook state
            hook: { state: 'idle', x: 0, y: 0, vx: 0, vy: 0, targetId: null, sx: 0, sy: 0 },
            lastHitBy: null // { uid, time }
        };

        const keys = { w: false, a: false, s: false, d: false };

        function getRandColor() {
            const colors = ['#0ea5e9', '#8b5cf6', '#d946ef', '#f43f5e', '#f59e0b', '#10b981'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
        window.dispatchEvent(new Event('resize'));

        window.addEventListener('keydown', e => {
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
            if(e.code === 'Space' && isPlaying) executeDash();
        });
        window.addEventListener('keyup', e => {
            if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
        });
        
        canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        canvas.addEventListener('contextmenu', e => e.preventDefault()); // Prevent right click menu
        
        canvas.addEventListener('mousedown', e => {
            if(!isPlaying || pState.isStunned || pState.isSlamming || !isAlive()) return;
            
            if(e.button === 0) { // Left Click: Charge Lasso
                if (pState.hook.state === 'idle') pState.isCharging = true;
                else if (pState.hook.state === 'attached') resetHook(); // Break hook
            } 
            else if (e.button === 2) { // Right Click: Shockwave
                executeShockwave();
            }
        });

        canvas.addEventListener('mouseup', e => {
            if(e.button === 0 && pState.isCharging) {
                pState.isCharging = false;
                throwHook();
            }
        });

        function isAlive() { return pState.radius > 0; }
        
        function updateMassAndRadius() {
            pState.radius = BASE_RADIUS + pState.score * RADIUS_PER_SCORE;
            pState.mass = BASE_MASS + pState.score * MASS_PER_SCORE;
        }

        function triggerScreenShake(intensity) { shake = Math.max(shake, intensity); }

        function spawnParticles(x, y, count, color, speedMultiplier = 1) {
            for(let i=0; i<count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 200 * speedMultiplier;
                particles.push({
                    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
                    life: 1.0, decay: Math.random() * 0.02 + 0.01,
                    color: color, size: Math.random() * 4 + 2
                });
            }
        }

        function respawn() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (ARENA_RADIUS * 0.7);
            pState.x = Math.cos(angle) * dist;
            pState.y = Math.sin(angle) * dist;
            pState.vx = 0; pState.vy = 0;
            pState.isStunned = false; pState.stunTimer = 0;
            pState.isSlamming = false; pState.slamTimer = 0; pState.slamZ = 0;
            pState.isCharging = false; pState.chargeTime = 0;
            resetHook();
            updateMassAndRadius();
            camX = pState.x - width/2; camY = pState.y - height/2; // Snap camera
            if(currentUser) syncToNetwork();
        }

        function executeDash() {
            if(pState.isStunned || pState.isSlamming || pState.dashTimer > 0 || !isAlive()) return;
            
            const worldMx = mouseX + camX; const worldMy = mouseY + camY;
            const dx = worldMx - pState.x; const dy = worldMy - pState.y;
            const mag = Math.hypot(dx, dy) || 1;
            
            pState.vx += (dx/mag) * DASH_FORCE;
            pState.vy += (dy/mag) * DASH_FORCE;
            pState.dashTimer = DASH_COOLDOWN;
            
            spawnParticles(pState.x, pState.y, 15, '#22d3ee', 2);
            triggerScreenShake(5);
            resetHook();
        }

        function executeShockwave() {
            if(pState.isStunned || pState.shockwaveTimer > 0 || pState.isSlamming || !isAlive()) return;
            
            pState.isSlamming = true;
            pState.slamTimer = 0.6; // 0.6s jump before slam
            pState.shockwaveTimer = SHOCKWAVE_COOLDOWN;
            pState.isCharging = false;
            resetHook();
        }

        function throwHook() {
            if(pState.isStunned || pState.isSlamming) return;
            
            const chargeRatio = Math.min(pState.chargeTime / MAX_CHARGE_TIME, 1);
            const hookSpeed = BASE_HOOK_SPEED + (MAX_HOOK_SPEED - BASE_HOOK_SPEED) * chargeRatio;
            
            const worldMx = mouseX + camX; const worldMy = mouseY + camY;
            const dx = worldMx - pState.x; const dy = worldMy - pState.y;
            const mag = Math.hypot(dx, dy) || 1;

            pState.hook = {
                state: 'thrown',
                x: pState.x, y: pState.y,
                vx: (dx/mag) * hookSpeed, vy: (dy/mag) * hookSpeed,
                sx: pState.x, sy: pState.y, // start pos for range calc
                targetId: null,
                maxRange: BASE_HOOK_RANGE + (MAX_HOOK_RANGE - BASE_HOOK_RANGE) * chargeRatio
            };
            pState.chargeTime = 0;
        }

        function resetHook() {
            pState.hook.state = 'idle';
            pState.hook.targetId = null;
        }

        document.getElementById('btn-join').addEventListener('click', async () => {
            const nick = document.getElementById('nickname').value.trim() || 'Void Walker';
            pState.name = nick.substring(0, 12);
            pState.color = getRandColor();
            
            lobby.style.display = 'none';
            hud.style.display = 'flex';
            
            try {
                if (typeof __initial_auth_token !== 'undefined') await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                
                currentUser = auth.currentUser;
                pState.id = currentUser.uid;
                isPlaying = true;
                respawn();
                listenToNetwork();
            } catch (err) { console.error("Auth:", err); }
        });

        function listenToNetwork() {
            const playersRef = collection(db, 'artifacts', appId, 'public', 'data', 'arena_players_letuggs');
            onSnapshot(playersRef, snap => {
                const now = Date.now();
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const uid = docSnap.id;
                    
                    if (now - data.lastActive < 5000 && uid !== pState.id) {
                        if (!players[uid]) players[uid] = { trail: [] };
                        const p = players[uid];
                        
                        // Detect remote shockwave event
                        if(data.lastShockwaveId && p.lastShockwaveId !== data.lastShockwaveId) {
                            spawnRemoteShockwave(data.x, data.y);
                        }

                        // Lerp targets
                        p.tx = data.x; p.ty = data.y;
                        p.vx = data.vx; p.vy = data.vy;
                        p.radius = data.radius; p.mass = data.mass;
                        p.score = data.score; p.color = data.color; p.name = data.name;
                        p.isStunned = data.isStunned; p.isSlamming = data.isSlamming;
                        p.hook = data.hook;
                        p.lastShockwaveId = data.lastShockwaveId;
                        p.lastActive = data.lastActive;
                        
                        // Snap if too far (teleport/respawn)
                        if(p.x === undefined || Math.hypot(p.tx - p.x, p.ty - p.y) > 200) {
                            p.x = p.tx; p.y = p.ty;
                        }
                    } else if (uid === pState.id && data.score > pState.score) {
                        // We got a kill point while we were alive/dead
                        pState.score = data.score;
                        updateMassAndRadius();
                        spawnParticles(pState.x, pState.y, 30, '#fbbf24', 2);
                    }
                });
                updateLeaderboard();
            });
        }

        function syncToNetwork() {
            if(!isPlaying || !currentUser) return;
            const now = Date.now();
            if (now - lastSyncTime > SYNC_RATE) {
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'arena_players_letuggs', pState.id), {
                    name: pState.name, color: pState.color,
                    x: Math.round(pState.x), y: Math.round(pState.y),
                    vx: Math.round(pState.vx), vy: Math.round(pState.vy),
                    radius: pState.radius, mass: pState.mass, score: pState.score,
                    isStunned: pState.isStunned, isSlamming: pState.isSlamming,
                    hook: pState.hook, lastShockwaveId: pState.lastShockwaveId,
                    lastActive: now
                }).catch(e=>{});
                lastSyncTime = now;
            }
        }
        
        window.addEventListener('beforeunload', () => {
            if(currentUser) deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'arena_players_letuggs', pState.id));
        });

        function spawnRemoteShockwave(x, y) {
            shockwaves.push({ x, y, r: 0, maxR: SHOCKWAVE_RANGE, alpha: 1 });
            triggerScreenShake(8);
            
            // Check if WE are hit by it
            const dist = Math.hypot(pState.x - x, pState.y - y);
            if(dist < SHOCKWAVE_RANGE && !pState.isSlamming && isAlive()) {
                const dirX = (pState.x - x) / (dist||1);
                const dirY = (pState.y - y) / (dist||1);
                const force = SHOCKWAVE_FORCE * (1 - dist/SHOCKWAVE_RANGE);
                pState.vx += dirX * force;
                pState.vy += dirY * force;
                resetHook();
            }
        }

        function updatePhysics(dt) {
            if (!isPlaying || !isAlive()) return;

            // Cooldowns
            if(pState.dashTimer > 0) pState.dashTimer -= dt;
            if(pState.shockwaveTimer > 0) pState.shockwaveTimer -= dt;
            if(pState.stunTimer > 0) {
                pState.stunTimer -= dt;
                if(pState.stunTimer <= 0) pState.isStunned = false;
            }

            // Charge Lasso
            if(pState.isCharging && pState.chargeTime < MAX_CHARGE_TIME) {
                pState.chargeTime += dt;
            }

            // Slam Logic (Jump -> Pause -> Slam)
            if(pState.isSlamming) {
                pState.slamTimer -= dt;
                pState.slamZ = Math.sin((pState.slamTimer / 0.6) * Math.PI) * 50; // Visual jump height
                
                if(pState.slamTimer <= 0) {
                    pState.isSlamming = false;
                    pState.slamZ = 0;
                    pState.lastShockwaveId = Date.now();
                    shockwaves.push({ x: pState.x, y: pState.y, r: 0, maxR: SHOCKWAVE_RANGE, alpha: 1 });
                    triggerScreenShake(15);
                    syncToNetwork(); // Immediately sync the slam
                }
            }

            // WASD Movement (Slower if charging or high mass)
            if(!pState.isStunned && !pState.isSlamming) {
                let ix = 0, iy = 0;
                if(keys.a) ix -= 1; if(keys.d) ix += 1;
                if(keys.w) iy -= 1; if(keys.s) iy += 1;
                
                if(ix !== 0 || iy !== 0) {
                    const len = Math.hypot(ix, iy);
                    const speedMod = pState.isCharging ? 0.4 : 1.0;
                    // Acceleration scales inversely with mass (heavier = slower to start)
                    const accel = (BASE_ACCEL / Math.sqrt(pState.mass)) * speedMod; 
                    pState.vx += (ix/len) * accel * dt;
                    pState.vy += (iy/len) * accel * dt;
                }
            }

            // Hook Dynamics
            if(pState.hook.state === 'thrown') {
                pState.hook.x += pState.hook.vx * dt;
                pState.hook.y += pState.hook.vy * dt;
                if(Math.hypot(pState.hook.x - pState.hook.sx, pState.hook.y - pState.hook.sy) > pState.hook.maxRange) {
                    resetHook();
                } else {
                    // Check collision with remote players
                    for(const uid in players) {
                        const p = players[uid];
                        if(Math.hypot(pState.hook.x - p.x, pState.hook.y - p.y) < p.radius + 10) {
                            pState.hook.state = 'attached'; pState.hook.targetId = uid;
                            break;
                        }
                    }
                }
            }

            // Hook Pulling (Spring Force based on relative mass)
            if(pState.hook.state === 'attached' && players[pState.hook.targetId]) {
                const target = players[pState.hook.targetId];
                const dx = target.x - pState.x; const dy = target.y - pState.y;
                pState.hook.x = target.x; pState.hook.y = target.y; // visual snap
                
                // If target is heavier, you get pulled more. If you are heavier, you pull them more.
                const totalMass = pState.mass + target.mass;
                const myPullRatio = target.mass / totalMass; // Higher target mass = we move more
                
                const springK = 3.0; // Spring constant
                pState.vx += dx * springK * myPullRatio * dt;
                pState.vy += dy * springK * myPullRatio * dt;
            }

            // Check if others hooked us
            for(const uid in players) {
                const p = players[uid];
                if(p.hook && p.hook.state === 'attached' && p.hook.targetId === pState.id) {
                    const dx = p.x - pState.x; const dy = p.y - pState.y;
                    const totalMass = pState.mass + p.mass;
                    const myPullRatio = p.mass / totalMass;
                    pState.vx += dx * 3.0 * myPullRatio * dt;
                    pState.vy += dy * 3.0 * myPullRatio * dt;
                    pState.lastHitBy = { uid, time: Date.now() };
                }
            }

            // Elastic Collisions & Stun Mechanics (Decentralized)
            for(const uid in players) {
                const p = players[uid];
                const dx = p.x - pState.x; const dy = p.y - pState.y;
                const dist = Math.hypot(dx, dy);
                const minDist = pState.radius + p.radius;

                if(dist > 0 && dist < minDist) {
                    // Push out of overlap based on mass ratio
                    const overlap = minDist - dist;
                    const totalMass = pState.mass + p.mass;
                    const myPushRatio = p.mass / totalMass;
                    
                    pState.x -= (dx/dist) * overlap * myPushRatio;
                    pState.y -= (dy/dist) * overlap * myPushRatio;

                    // Elastic Momentum calculation
                    const relVx = p.vx - pState.vx;
                    const relVy = p.vy - pState.vy;
                    const velAlongNormal = relVx * (dx/dist) + relVy * (dy/dist);

                    if(velAlongNormal < 0) {
                        // Bounce force (Restitution = 0.8)
                        const restitution = 0.8;
                        const j = -(1 + restitution) * velAlongNormal;
                        const impulse = j / (1/pState.mass + 1/p.mass);
                        
                        pState.vx -= (impulse / pState.mass) * (dx/dist);
                        pState.vy -= (impulse / pState.mass) * (dy/dist);

                        // High velocity hit detection (Dash Stun)
                        const pSpeed = Math.hypot(p.vx, p.vy);
                        if(pSpeed > 1500) { // They hit us hard
                            pState.isStunned = true; pState.stunTimer = STUN_DURATION;
                            pState.lastHitBy = { uid, time: Date.now() };
                            triggerScreenShake(10);
                            resetHook();
                        }
                    }
                }
            }

            // Apply Velocity & Friction
            if(!pState.isSlamming) {
                pState.vx *= Math.pow(FRICTION, dt * 60);
                pState.vy *= Math.pow(FRICTION, dt * 60);
                pState.x += pState.vx * dt;
                pState.y += pState.vy * dt;
            }

            // Trails
            const speed = Math.hypot(pState.vx, pState.vy);
            if(speed > 100 && Math.random() < 0.3 && !pState.isSlamming) {
                pState.trail.push({ x: pState.x, y: pState.y, age: 1.0 });
            }
            pState.trail.forEach(t => t.age -= dt * 2);
            pState.trail = pState.trail.filter(t => t.age > 0);

            // Death Condition (Fell off arena)
            if(Math.hypot(pState.x, pState.y) > ARENA_RADIUS && !pState.isSlamming) {
                spawnParticles(pState.x, pState.y, 50, pState.color, 3);
                triggerScreenShake(15);
                
                if(pState.lastHitBy && (Date.now() - pState.lastHitBy.time < 4000)) {
                    // Give point to killer directly via Firebase increment
                    updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'arena_players_letuggs', pState.lastHitBy.uid), {
                        score: increment(1)
                    }).catch(e=>console.log(e));
                } else {
                    pState.score = Math.max(0, pState.score - 1); // Suicide penalty
                }
                respawn();
            }

            syncToNetwork();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            const step = 80;
            // Parallax grid
            const offsetX = (camX * -0.5) % step;
            const offsetY = (camY * -0.5) % step;
            
            ctx.beginPath();
            for(let x = offsetX - step; x < width + step; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y = offsetY - step; y < height + step; y += step) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();
        }

        function drawArena() {
            // Screen coords for arena center (0,0)
            const cx = -camX + (shake ? (Math.random()-0.5)*shake : 0);
            const cy = -camY + (shake ? (Math.random()-0.5)*shake : 0);

            // Deep glow
            const grad = ctx.createRadialGradient(cx, cy, ARENA_RADIUS-100, cx, cy, ARENA_RADIUS+200);
            grad.addColorStop(0, 'rgba(139, 92, 246, 0)');
            grad.addColorStop(0.8, 'rgba(139, 92, 246, 0.2)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, ARENA_RADIUS+200, 0, Math.PI*2); ctx.fill();

            // Floor
            ctx.fillStyle = '#050510';
            ctx.beginPath(); ctx.arc(cx, cy, ARENA_RADIUS, 0, Math.PI*2); ctx.fill();

            // Neon Edge
            ctx.shadowColor = '#d946ef'; ctx.shadowBlur = 20;
            ctx.strokeStyle = '#d946ef'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(cx, cy, ARENA_RADIUS, 0, Math.PI*2); ctx.stroke();
            ctx.shadowBlur = 0; // reset
        }

        function drawTrail(trailObj, color) {
            if(trailObj.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(trailObj[0].x - camX, trailObj[0].y - camY);
            for(let i=1; i<trailObj.length; i++) {
                ctx.lineTo(trailObj[i].x - camX, trailObj[i].y - camY);
            }
            ctx.strokeStyle = color;
            ctx.lineWidth = pState.radius * 0.8;
            ctx.lineCap = 'round';
            ctx.globalAlpha = 0.2;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        function drawEntity(p, isLocal) {
            const sx = p.x - camX; const sy = p.y - camY;
            const zOffset = p.slamZ || 0; // Jump height
            const rad = p.radius + (zOffset * 0.3); // Appear larger when jumping

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath(); ctx.arc(sx, sy + p.radius*0.5, p.radius, 0, Math.PI*2); ctx.fill();

            // Body
            ctx.shadowColor = p.isStunned ? 'transparent' : p.color;
            ctx.shadowBlur = p.isStunned ? 0 : 15;
            ctx.fillStyle = p.isStunned ? '#64748b' : p.color;
            ctx.beginPath(); ctx.arc(sx, sy - zOffset, rad, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Core inner glow
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(sx - rad*0.3, sy - zOffset - rad*0.3, rad*0.4, 0, Math.PI*2); ctx.fill();

            // Stun Stars
            if(p.isStunned) {
                ctx.fillStyle = '#fde047';
                const time = Date.now() / 150;
                ctx.beginPath(); ctx.arc(sx + Math.cos(time)*rad, sy - zOffset - rad - 5 + Math.sin(time)*5, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(sx + Math.cos(time+2)*rad, sy - zOffset - rad - 5 + Math.sin(time+2)*5, 4, 0, Math.PI*2); ctx.fill();
            }

            // Name & Mass
            ctx.fillStyle = isLocal ? '#a78bfa' : 'white';
            ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
            ctx.fillText(p.name, sx, sy - zOffset - rad - 15);
            ctx.fillStyle = '#9ca3af'; ctx.font = '10px Inter';
            ctx.fillText(`Mass: ${p.mass?.toFixed(1)}`, sx, sy - zOffset - rad - 5);
        }

        function drawHook(hook, startX, startY, startZ, color) {
            if(hook.state === 'idle') return;
            const sx = startX - camX; const sy = startY - camY - startZ;
            const hx = hook.x - camX; const hy = hook.y - camY;

            ctx.strokeStyle = color; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();

            ctx.fillStyle = hook.state === 'attached' ? '#f43f5e' : '#fff';
            ctx.beginPath(); ctx.arc(hx, hy, 8, 0, Math.PI*2); ctx.fill();
        }

        function drawEffects(dt) {
            // Shockwaves
            for(let i=shockwaves.length-1; i>=0; i--) {
                const sw = shockwaves[i];
                sw.r += 1500 * dt; // Expansion speed
                sw.alpha -= 1.5 * dt;
                if(sw.alpha <= 0) { shockwaves.splice(i,1); continue; }
                
                ctx.strokeStyle = `rgba(217, 70, 239, ${sw.alpha})`;
                ctx.lineWidth = 15 * sw.alpha;
                ctx.beginPath(); ctx.arc(sw.x - camX, sw.y - camY, sw.r, 0, Math.PI*2); ctx.stroke();
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt;
                p.life -= p.decay;
                if(p.life <= 0) { particles.splice(i,1); continue; }
                
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
                ctx.beginPath(); ctx.arc(p.x - camX, p.y - camY, p.size, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function updateHUD() {
            document.getElementById('cd-dash').style.width = Math.max(0, 100 - (pState.dashTimer / DASH_COOLDOWN) * 100) + '%';
            document.getElementById('cd-shock').style.width = Math.max(0, 100 - (pState.shockwaveTimer / SHOCKWAVE_COOLDOWN) * 100) + '%';
        }

        function updateLeaderboard() {
            const all = [{ name: pState.name, color: pState.color, score: pState.score, mass: pState.mass, isMe: true }];
            for(const uid in players) {
                const p = players[uid];
                all.push({ name: p.name, color: p.color, score: p.score, mass: p.mass, isMe: false });
            }
            all.sort((a,b) => b.score - a.score);
            
            document.getElementById('lb-content').innerHTML = all.slice(0, 6).map(p => `
                <div class="lb-row items-center">
                    <div class="flex items-center gap-2 text-sm">
                        <span style="width:10px;height:10px;border-radius:50%;background:${p.color}"></span>
                        <span class="${p.isMe ? 'text-white font-bold' : 'text-gray-300'}">${p.name}</span>
                    </div>
                    <div class="text-xs text-gray-400 font-bold">${p.mass?.toFixed(1)} M</div>
                </div>
            `).join('');
        }

        function draw() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            if(!isPlaying) return;

            // Camera Smooth Follow
            targetCamX = pState.x - width/2; targetCamY = pState.y - height/2;
            camX += (targetCamX - camX) * 0.1; camY += (targetCamY - camY) * 0.1;

            if(shake > 0.1) { ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }

            drawGrid();
            drawArena();
            
            // Remote Players (Lerp, Trails, Draw)
            for(const uid in players) {
                const p = players[uid];
                // Lerp remote positions
                p.x = p.x + (p.tx - p.x) * 0.3 || p.tx;
                p.y = p.y + (p.ty - p.y) * 0.3 || p.ty;
                
                if(Math.hypot(p.vx, p.vy)>100 && Math.random()<0.3) p.trail.push({x:p.x, y:p.y, age:1});
                p.trail.forEach(t => t.age -= 0.03); p.trail = p.trail.filter(t=>t.age>0);
                
                drawTrail(p.trail, p.color);
                if(p.hook) drawHook(p.hook, p.x, p.y, 0, p.color);
                drawEntity(p, false);
            }

            // Local Player
            drawTrail(pState.trail, pState.color);
            drawHook(pState.hook, pState.x, pState.y, pState.slamZ, pState.color);
            drawEntity(pState, true);

            drawEffects(0.016); // Approx dt for visual fx

            // Charge Aiming Laser
            if(pState.isCharging && !pState.isSlamming) {
                const chargeRatio = Math.min(pState.chargeTime / MAX_CHARGE_TIME, 1);
                const range = BASE_HOOK_RANGE + (MAX_HOOK_RANGE - BASE_HOOK_RANGE) * chargeRatio;
                
                const worldMx = mouseX + camX; const worldMy = mouseY + camY;
                const dx = worldMx - pState.x; const dy = worldMy - pState.y;
                const mag = Math.hypot(dx, dy) || 1;
                
                ctx.strokeStyle = `rgba(217, 70, 239, ${0.2 + chargeRatio*0.5})`;
                ctx.lineWidth = 2 + chargeRatio * 4;
                ctx.setLineDash([10, 15]);
                ctx.beginPath();
                ctx.moveTo(pState.x - camX, pState.y - camY - pState.slamZ);
                ctx.lineTo(pState.x - camX + (dx/mag)*range, pState.y - camY + (dy/mag)*range);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if(shake > 0.1) { ctx.restore(); shake *= 0.9; }
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // Cap dt
            lastTime = timestamp;

            if (isPlaying) {
                updatePhysics(dt);
                updateHUD();
            }
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        requestAnimationFrame(gameLoop);
    </script>
</body>
