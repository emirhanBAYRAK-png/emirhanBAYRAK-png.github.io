<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night in the Forest</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair">·</div>
        
        <div id="start-screen">
            <h1 class="glitch-text">Night in the Forest</h1>
            <p>Kulaklıklarınızı Takın. Gerçeklik Kırılıyor.</p>
            <p>Başlamak İçin Tıklayın.</p>
            <div class="controls">
                <span>[ W A S D ] Hareket</span>
                <span>[ SHIFT ] Koşma</span>
                <span>[ FARE ] Bakış</span>
            </div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>Etrafta senden başka kimse yoktu.</h1>
            <p>Kendi korkunun kurbanı oldun.</p>
        </div>
    </div>
    
    <script src="map.js"></script>
    <script src="main.js"></script>
</body>
</html>
