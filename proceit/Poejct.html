<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Proceit</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; color: #fff; font-family: monospace; font-size: 14px; }
        /* CRT/Retro Görünüm Güçlendirildi */
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; filter: contrast(130%) brightness(80%) sepia(10%); }

        /* Minimalist Pil İkonu */
        #battery-icon { position: fixed; top: 20px; left: 20px; width: 30px; height: 14px; border: 2px solid #555; border-radius: 2px; padding: 1px; z-index: 100; }
        #battery-icon::after { content: ''; position: absolute; top: 3px; right: -5px; width: 3px; height: 8px; background: #555; }
        #battery-level { width: 100%; height: 100%; background-color: #00ff00; transition: width 0.2s linear; }
        .critical { background-color: #ff0000 !important; animation: blink 0.4s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* Mermi Arayüzü */
        #ammo-hud { position: fixed; top: 20px; right: 20px; font-size: 20px; font-weight: bold; color: #ffaa00; text-shadow: 2px 2px 0px #000; z-index: 100; }

        #controls { position: fixed; bottom: 20px; left: 20px; color: #444; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="battery-icon"><div id="battery-level"></div></div>
    <div id="ammo-hud"><span id="ammo-count"></span></div>
    <div id="controls">FENER: [F]</div>
    <canvas id="gameCanvas"></canvas>
    <script src="map.js"></script>
    <script src="player.js"></script>
    <script src="engine.js"></script>
</body>
</html>
