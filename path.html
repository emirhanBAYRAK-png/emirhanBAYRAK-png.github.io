<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathmosflexion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        .menu-card {
            background: rgba(10, 10, 25, 0.85);
            padding: 50px 80px;
            border: 2px solid #3498db;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(52, 152, 219, 0.3);
            pointer-events: auto;
        }
        h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            background: linear-gradient(to bottom, #fff, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            text-transform: uppercase;
        }
        .btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 40px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 20px;
        }
        .btn:hover {
            background: #fff;
            color: #050508;
            box-shadow: 0 0 20px #fff;
        }
        #level-info {
            position: absolute;
            top: 30px;
            left: 40px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }
        canvas {
            background-color: #050508;
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="ui-layer"></div>
<canvas id="gameCanvas" width="1600" height="900"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui-layer');

    // Fizik ve Oyun Ayarları
    const G = 0.9; 
    const SHIP_RADIUS = 10;
    const DRAG_MULTIPLIER = 0.08; 
    const MAX_DRAG_DIST = 300;    

    const STATE = { MENU: 0, PLAYING: 1, DRAGGING: 2, LAUNCHED: 3, SUCCESS: 4, FAIL: 5, VICTORY: 6 };
    let currentState = STATE.MENU;
    let currentLevelIndex = 0;

    let ship = { x: 0, y: 0, vx: 0, vy: 0, trail: [] };
    let stars = [];
    let nebulas = [];
    let mouse = { x: 0, y: 0 };
    let dragStart = { x: 0, y: 0 };

        const levels = [
        { shipStart:{x:150, y:450}, goal:{x:1400, y:300, w:120, h:300}, planets:[{x:800, y:550, mass:1000, radius:50, color:'#e74c3c', glow:'#c0392b'}] },
        { shipStart:{x:150, y:150}, goal:{x:1400, y:650, w:150, h:150}, planets:[{x:800, y:450, mass:3000, radius:80, color:'#3498db', glow:'#2980b9'}] },
        { shipStart:{x:100, y:450}, goal:{x:1450, y:400, w:120, h:120}, planets:[{x:500, y:300, mass:1800, radius:60, color:'#2ecc71', glow:'#27ae60'}, {x:1000, y:600, mass:1500, radius:50, color:'#9b59b6', glow:'#8e44ad'}] },
        { shipStart:{x:150, y:450}, goal:{x:1450, y:400, w:120, h:120}, planets:[{x:800, y:200, mass:2500, radius:70, color:'#f1c40f', glow:'#f39c12'}, {x:800, y:700, mass:2500, radius:70, color:'#e67e22', glow:'#d35400'}] },
        { shipStart:{x:1450, y:450}, goal:{x:50, y:350, w:150, h:150}, planets:[{x:750, y:450, mass:800, radius:40, color:'#1abc9c', glow:'#16a085'}] }, 

        { shipStart:{x:100, y:800}, goal:{x:1400, y:50, w:150, h:150}, planets:[{x:700, y:450, mass:4500, radius:100, color:'#8e44ad', glow:'#9b59b6'}] }, 
        { shipStart:{x:100, y:450}, goal:{x:1450, y:350, w:100, h:200}, planets:[{x:400, y:450, mass:600, radius:30, color:'#ecf0f1', glow:'#bdc3c7'}, {x:800, y:450, mass:600, radius:30, color:'#ecf0f1', glow:'#bdc3c7'}, {x:1200, y:450, mass:600, radius:30, color:'#ecf0f1', glow:'#bdc3c7'}] },
        { shipStart:{x:150, y:200}, goal:{x:1400, y:700, w:120, h:120}, planets:[{x:600, y:600, mass:3500, radius:90, color:'#e74c3c', glow:'#c0392b'}, {x:1000, y:300, mass:1000, radius:50, color:'#2ecc71', glow:'#27ae60'}] },
        { shipStart:{x:100, y:450}, goal:{x:1400, y:400, w:150, h:150}, planets:[{x:400, y:200, mass:1500, radius:50, color:'#3498db', glow:'#2980b9'}, {x:700, y:700, mass:1800, radius:55, color:'#f1c40f', glow:'#f39c12'}, {x:1100, y:200, mass:1500, radius:50, color:'#e67e22', glow:'#d35400'}] },
        { shipStart:{x:100, y:450}, goal:{x:800, y:750, w:120, h:120}, planets:[{x:800, y:450, mass:5000, radius:110, color:'#000', glow:'#fff'}] }, 

        { shipStart:{x:100, y:100}, goal:{x:1450, y:750, w:100, h:100}, planets:[{x:800, y:450, mass:2500, radius:60, color:'#1abc9c', glow:'#16a085'}] }, 
        { shipStart:{x:100, y:450}, goal:{x:1450, y:400, w:150, h:150}, planets:[{x:500, y:450, mass:800, radius:35, color:'#e74c3c', glow:'#c0392b'}, {x:800, y:300, mass:3000, radius:75, color:'#3498db', glow:'#2980b9'}, {x:1100, y:600, mass:1500, radius:45, color:'#2ecc71', glow:'#27ae60'}] },
        { shipStart:{x:100, y:450}, goal:{x:1450, y:350, w:100, h:250}, planets:[{x:800, y:50, mass:5000, radius:100, color:'#9b59b6', glow:'#8e44ad'}, {x:800, y:850, mass:5000, radius:100, color:'#9b59b6', glow:'#8e44ad'}] }, 
        { shipStart:{x:800, y:800}, goal:{x:750, y:50, w:150, h:100}, planets:[{x:600, y:450, mass:2000, radius:60, color:'#e67e22', glow:'#d35400'}, {x:1000, y:450, mass:2000, radius:60, color:'#f1c40f', glow:'#f39c12'}] },
        { shipStart:{x:150, y:450}, goal:{x:1400, y:400, w:120, h:120}, planets:[{x:800, y:450, mass:6000, radius:120, color:'#c0392b', glow:'#e74c3c'}, {x:800, y:150, mass:400, radius:20, color:'#bdc3c7', glow:'#ecf0f1'}, {x:800, y:750, mass:400, radius:20, color:'#bdc3c7', glow:'#ecf0f1'}] }, 

        { shipStart:{x:150, y:800}, goal:{x:1400, y:100, w:120, h:120}, planets:[{x:400, y:400, mass:2500, radius:65, color:'#2980b9', glow:'#3498db'}, {x:1200, y:500, mass:2500, radius:65, color:'#27ae60', glow:'#2ecc71'}, {x:800, y:200, mass:1000, radius:40, color:'#f39c12', glow:'#f1c40f'}] },
        { shipStart:{x:100, y:450}, goal:{x:1450, y:400, w:120, h:120}, planets:[{x:300, y:300, mass:1800, radius:50, color:'#8e44ad', glow:'#9b59b6'}, {x:600, y:600, mass:1800, radius:50, color:'#d35400', glow:'#e67e22'}, {x:900, y:300, mass:1800, radius:50, color:'#c0392b', glow:'#e74c3c'}, {x:1200, y:600, mass:1800, radius:50, color:'#16a085', glow:'#1abc9c'}] }, 
        { shipStart:{x:150, y:450}, goal:{x:100, y:200, w:120, h:120}, planets:[{x:800, y:450, mass:7000, radius:130, color:'#e74c3c', glow:'#c0392b'}] }, 
        { shipStart:{x:100, y:800}, goal:{x:1450, y:750, w:120, h:120}, planets:[{x:400, y:700, mass:800, radius:30, color:'#3498db', glow:'#2980b9'}, {x:800, y:500, mass:2000, radius:60, color:'#9b59b6', glow:'#8e44ad'}, {x:1200, y:300, mass:4000, radius:90, color:'#f1c40f', glow:'#f39c12'}] },
        { shipStart:{x:50, y:450}, goal:{x:1450, y:400, w:100, h:100}, planets:[{x:300, y:200, mass:2500, radius:70, color:'#e67e22', glow:'#d35400'}, {x:300, y:700, mass:2500, radius:70, color:'#2ecc71', glow:'#27ae60'}, {x:800, y:450, mass:6000, radius:100, color:'#c0392b', glow:'#e74c3c'}, {x:1300, y:200, mass:2500, radius:70, color:'#3498db', glow:'#2980b9'}, {x:1300, y:700, mass:2500, radius:70, color:'#9b59b6', glow:'#8e44ad'}] } 
    ];

    function initSpace() {
        stars = [];
        for(let i=0; i<400; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, opacity: Math.random() });
        }
        nebulas = [];
        for(let i=0; i<5; i++) {
            nebulas.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 200 + Math.random() * 300, color: `hsla(${Math.random() * 360}, 50%, 20%, 0.1)` });
        }
    }

    function showMenu(type) {
        let content = "";
        if(type === 'main') {
            content = `<div class="menu-card"><h1>Pathmosflexıon</h1><p style="color: #3498db; letter-spacing: 2px;">GRAVİTASYONEL YÖRÜNGE SİMÜLASYONU</p><button class="btn" onclick="startGame()">BAŞLA</button></div>`;
        } else if(type === 'fail') {
            content = `<div class="menu-card"><h1 style="color: #e74c3c;">SİNYAL KAYBI</h1><p>Çarpışma veya uzay boşluğuna sürüklenme.</p><button class="btn" onclick="retryLevel()">TEKRAR DENE</button></div>`;
        } else if(type === 'success') {
            content = `<div class="menu-card"><h1 style="color: #2ecc71;">SEKTÖR GEÇİLDİ</h1><p>Sıradaki yörüngeye geçiliyor...</p><button class="btn" onclick="nextLevel()">DEVAM ET</button></div>`;
        } else if(type === 'victory') {
            content = `<div class="menu-card"><h1>Pathmosflexion</h1><p style="color: #f1c40f;">TÜM 20 BÖLÜM TAMAMLANDI</p><p>Mükemmel yörünge mühendisliği!</p><button class="btn" onclick="showMenu('main')">ANA MENÜ</button></div>`;
        }
        
        let levelText = (currentState !== STATE.MENU && currentState !== STATE.VICTORY) ? `<div id="level-info">SEVİYE: ${currentLevelIndex + 1} / 20</div>` : "";
        ui.innerHTML = levelText + content;
    }

    function startGame() { currentLevelIndex = 0; initLevel(0); }
    function retryLevel() { initLevel(currentLevelIndex); }
    function nextLevel() {
        currentLevelIndex++;
        if(currentLevelIndex < levels.length) initLevel(currentLevelIndex);
        else { currentState = STATE.VICTORY; showMenu('victory'); }
    }

    function initLevel(index) {
        ui.innerHTML = `<div id="level-info">SEVİYE: ${index + 1} / 20</div>`;
        currentState = STATE.PLAYING;
        const lvl = levels[index];
        ship.x = lvl.shipStart.x;
        ship.y = lvl.shipStart.y;
        ship.vx = 0; ship.vy = 0; ship.trail = [];
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }

    window.addEventListener('mousedown', (e) => {
        if(currentState !== STATE.PLAYING) return;
        const pos = getCoords(e);
        if(Math.hypot(pos.x - ship.x, pos.y - ship.y) < 60) { currentState = STATE.DRAGGING; dragStart = pos; mouse = pos; }
    });
    window.addEventListener('mousemove', (e) => { 
        if(currentState === STATE.DRAGGING) { mouse = getCoords(e); } 
    });
    window.addEventListener('mouseup', () => {
        if(currentState === STATE.DRAGGING) {
            let dx = dragStart.x - mouse.x; let dy = dragStart.y - mouse.y; let d = Math.hypot(dx, dy);
            if(d > MAX_DRAG_DIST) { dx *= MAX_DRAG_DIST / d; dy *= MAX_DRAG_DIST / d; }
            ship.vx = dx * DRAG_MULTIPLIER; ship.vy = dy * DRAG_MULTIPLIER;
            currentState = STATE.LAUNCHED;
        }
    });

    window.addEventListener('touchstart', (e) => {
        if(currentState !== STATE.PLAYING) return;
        const pos = getCoords(e);
        if(Math.hypot(pos.x - ship.x, pos.y - ship.y) < 80) { currentState = STATE.DRAGGING; dragStart = pos; mouse = pos;}
    });
    window.addEventListener('touchmove', (e) => { if(currentState === STATE.DRAGGING) mouse = getCoords(e); });
    window.addEventListener('touchend', () => {
        if(currentState === STATE.DRAGGING) {
            let dx = dragStart.x - mouse.x; let dy = dragStart.y - mouse.y; let d = Math.hypot(dx, dy);
            if(d > MAX_DRAG_DIST) { dx *= MAX_DRAG_DIST / d; dy *= MAX_DRAG_DIST / d; }
            ship.vx = dx * DRAG_MULTIPLIER; ship.vy = dy * DRAG_MULTIPLIER;
            currentState = STATE.LAUNCHED;
        }
    });

    function drawSpace() {
        ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        nebulas.forEach(n => {
            const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            g.addColorStop(0, n.color); g.addColorStop(1, 'transparent');
            ctx.fillStyle = g; ctx.fillRect(0,0, canvas.width, canvas.height);
        });
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            s.opacity += (Math.random() - 0.5) * 0.05;
            ctx.globalAlpha = Math.max(0.1, Math.min(1, s.opacity));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // İnce Beyaz Çerçeve (Oyun sınırları)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
    }

    function drawPlanet(p) {
        const g = ctx.createRadialGradient(p.x, p.y, p.radius, p.x, p.y, p.radius * 2.5);
        g.addColorStop(0, p.glow + '55'); g.addColorStop(1, 'transparent');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = p.glow + '33'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 1.8, 0, Math.PI*2); ctx.stroke();
        const bodyG = ctx.createRadialGradient(p.x - p.radius/3, p.y - p.radius/3, p.radius/10, p.x, p.y, p.radius);
        bodyG.addColorStop(0, '#fff'); bodyG.addColorStop(0.3, p.color); bodyG.addColorStop(1, '#000');
        ctx.fillStyle = bodyG; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
    }

    function drawShip() {
        if(ship.trail.length > 1) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(52, 152, 219, 0.6)'; ctx.lineWidth = 3;
            ctx.moveTo(ship.trail[0].x, ship.trail[0].y);
            for(let i=1; i<ship.trail.length; i++) ctx.lineTo(ship.trail[i].x, ship.trail[i].y);
            ctx.stroke();
        }
        ctx.save(); ctx.translate(ship.x, ship.y);
        
        // Gemi Yönü Hesaplaması
        let angle = 0;
        if (currentState === STATE.LAUNCHED) {
            angle = Math.atan2(ship.vy, ship.vx); // Uçarken gittiği yöne bakar
        } else if (currentState === STATE.DRAGGING) {
            angle = Math.atan2(dragStart.y - mouse.y, dragStart.x - mouse.x); // Çekilirken fırlatılacağı yöne bakar
        } 
        // PLAYING (Bekleme) durumunda angle = 0 kalır (Düz bakar, fareden etkilenmez)

        ctx.rotate(angle);
        ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, -10); ctx.lineTo(-5, 0); ctx.lineTo(-10, 10); ctx.closePath();
        ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore(); 
    }

    // FİZİK VE ÇİZİM AYNI DÖNGÜDE (Smooth gameplay için)
    function gameLoop() {
        // --- GÜNCELLEME (UPDATE) ---
        if(currentState === STATE.LAUNCHED) {
            const lvl = levels[currentLevelIndex]; let ax = 0, ay = 0;
            lvl.planets.forEach(p => {
                const dx = p.x - ship.x; const dy = p.y - ship.y; const d2 = dx*dx + dy*dy; const d = Math.sqrt(d2);
                if(d < p.radius + SHIP_RADIUS) { currentState = STATE.FAIL; showMenu('fail'); }
                const force = (G * p.mass) / d2;
                ax += force * (dx/d); ay += force * (dy/d);
            });
            ship.vx += ax; ship.vy += ay; ship.x += ship.vx; ship.y += ship.vy;
            ship.trail.push({x: ship.x, y: ship.y}); if(ship.trail.length > 70) ship.trail.shift();

            if(ship.x < 0 || ship.x > canvas.width || ship.y < 0 || ship.y > canvas.height) {
                currentState = STATE.FAIL; showMenu('fail');
            }
            const g = lvl.goal;
            if(ship.x > g.x && ship.x < g.x + g.w && ship.y > g.y && ship.y < g.y + g.h) {
                currentState = STATE.SUCCESS; showMenu('success');
            }
        }

        // --- ÇİZİM (RENDER) ---
        drawSpace();
        if(currentLevelIndex < levels.length && currentState !== STATE.VICTORY && currentState !== STATE.MENU) {
            const lvl = levels[currentLevelIndex];
            ctx.fillStyle = 'rgba(46, 204, 113, 0.2)'; ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
            ctx.strokeRect(lvl.goal.x, lvl.goal.y, lvl.goal.w, lvl.goal.h); ctx.fillRect(lvl.goal.x, lvl.goal.y, lvl.goal.w, lvl.goal.h); ctx.setLineDash([]);
            lvl.planets.forEach(drawPlanet);
            if(currentState === STATE.DRAGGING) {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
                ctx.moveTo(ship.x, ship.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
            }
            drawShip();
        }

        requestAnimationFrame(gameLoop);
    }

    initSpace(); 
    showMenu('main'); 
    requestAnimationFrame(gameLoop); // Ana döngüyü başlat
</script>
</body>
</html>
