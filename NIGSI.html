<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGSI - Ses Ağı</title>
    <!-- Jitsi API -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* LOGO */
        .logo {
            font-size: 4rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            letter-spacing: 8px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        /* GİRİŞ EKRANI */
        #login-screen {
            background: rgba(20, 20, 20, 0.9);
            padding: 30px 40px;
            border-radius: 12px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            text-align: center;
            width: 320px;
            z-index: 10;
        }

        input {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #333;
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #00ffff; }

        .btn {
            background: #000;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #00ffff; color: #000; }

        #error-msg { color: #ff3333; display: none; margin-top: 15px; font-weight: bold; }

        /* ODA EKRANI */
        #room-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        #loading-text {
            color: #00ffff;
            font-size: 1.5rem;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .participants-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin-top: 20px;
        }

        /* KULLANICI KARTLARI (Sadece İsim ve Ses Çubuğu) */
        .user-card {
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #333;
            padding: 20px;
            border-radius: 10px;
            width: 180px;
            text-align: center;
            transition: 0.3s;
        }

        /* KONUŞMA ANİMASYONU */
        .user-card.speaking {
            border-color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            transform: translateY(-5px);
        }
        .user-card.speaking .user-name {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .user-card.muted { border-color: #ff3333; opacity: 0.6; }

        .user-name {
            font-size: 1.4rem;
            color: #ddd;
            font-weight: bold;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.3s;
        }

        /* SES SEVİYESİ ÇUBUĞU */
        .volume-box { margin-top: 15px; }
        .volume-box span { display: block; font-size: 0.8rem; color: #777; margin-bottom: 5px; }
        input[type="range"] {
            width: 100%;
            accent-color: #00ffff;
            cursor: pointer;
        }

        /* ALT KONTROL BUTONLARI */
        .bottom-controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        .btn-mute { border-color: #ff3333; color: #ff3333; width: auto; padding: 12px 30px; }
        .btn-mute:hover { background: #ff3333; color: #000; }
        
        .btn-leave { border-color: #666; color: #aaa; width: auto; padding: 12px 30px; }
        .btn-leave:hover { background: #666; color: #fff; }

        /* JITSI GİZLEME (SORUNU ÇÖZEN ARKA PLAN YÖNTEMİ) */
        #jitsi-iframe-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Arayüzün arkasında kalır */
            opacity: 0.001; /* Tarayıcı görür, kullanıcı görmez */
            pointer-events: none; /* Tıklamaları engellemez */
        }
    </style>
</head>
<body>

    <!-- Arka Planda Çalışacak Görünmez Jitsi Alanı -->
    <div id="jitsi-iframe-container"></div>

    <div class="logo">NIGSI</div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <input type="text" id="usernameInput" placeholder="Takma İsim" maxlength="12" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Şifre">
        <button class="btn" onclick="startNigsi()">BAĞLAN</button>
        <p id="error-msg">Şifre Hatalı!</p>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="room-screen">
        <div id="loading-text">SES AĞINA BAĞLANILIYOR...</div>
        
        <div class="participants-container" id="participants-list">
            <!-- Kişiler Buraya Eklenecek -->
        </div>

        <div class="bottom-controls">
            <button class="btn btn-mute" id="muteBtn" onclick="toggleMyMicrophone()">MİKROFONU KAPAT</button>
            <button class="btn btn-leave" onclick="location.reload()">BAĞLANTIYI KES</button>
        </div>
    </div>

    <script>
        let api = null;
        let myUserId = null;
        let isMyMicMuted = false;

        function startNigsi() {
            const userName = document.getElementById("usernameInput").value.trim();
            const pass = document.getElementById("passwordInput").value;

            // Şifre Kontrolü
            if (pass !== "nigıbigı30") {
                document.getElementById("error-msg").style.display = "block";
                return;
            }
            if (!userName) {
                alert("Lütfen bir isim gir!");
                return;
            }

            // Ekranları Değiştir
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("room-screen").style.display = "flex";

            // Sistemi Başlat
            initializeVoiceChat(userName);
        }

        function initializeVoiceChat(userName) {
            const domain = 'meet.jit.si';
            const options = {
                roomName: 'Nigsi_RevereGames_SecretVoice_101', // Odanın sabit adı
                parentNode: document.querySelector('#jitsi-iframe-container'),
                userInfo: { displayName: userName },
                configOverwrite: {
                    prejoinConfig: { enabled: false }, // TAKILMA SORUNUNU ÇÖZEN KOD
                    prejoinPageEnabled: false,
                    startAudioOnly: true,
                    startWithVideoMuted: true,
                    disableDeepLinking: true
                },
                interfaceConfigOverwrite: { SHOW_CHROME_EXTENSION_BANNER: false }
            };
            
            api = new JitsiMeetExternalAPI(domain, options);

            // 1. Sen Odaya Katıldığında
            api.addListener('videoConferenceJoined', (user) => {
                myUserId = user.id;
                document.getElementById("loading-text").style.display = "none"; // Yükleniyor yazısını gizle
                createParticipantCard(user.id, userName, true);
            });

            // 2. Başkası Odaya Katıldığında
            api.addListener('participantJoined', (user) => {
                createParticipantCard(user.id, user.displayName, false);
            });

            // 3. Biri Odadan Çıktığında
            api.addListener('participantLeft', (user) => {
                const card = document.getElementById('user-' + user.id);
                if(card) card.remove();
            });

            // 4. KONUŞAN KİŞİYİ PARLATMA
            api.addListener('dominantSpeakerChanged', (user) => {
                // Önce herkesin parlamasını kapat
                document.querySelectorAll('.user-card').forEach(card => card.classList.remove('speaking'));
                
                // Sadece konuşanı parlat
                const speakerCard = document.getElementById('user-' + user.id);
                if(speakerCard && !speakerCard.classList.contains('muted')) {
                    speakerCard.classList.add('speaking');
                }
            });

            // 5. Biri Mikrofonu Susturduğunda (Sessiz İkonu / Rengi)
            api.addListener('audioMuteStatusChanged', (status) => {
                const targetId = status.id || myUserId;
                const card = document.getElementById('user-' + targetId);
                
                if(card) {
                    if(status.muted) {
                        card.classList.add('muted');
                        card.classList.remove('speaking');
                    } else {
                        card.classList.remove('muted');
                    }
                }
            });
        }

        // Kişi Kartı Oluşturucu
        function createParticipantCard(id, name, isMe) {
            if(document.getElementById('user-' + id)) return; // Zaten varsa ekleme

            const card = document.createElement('div');
            card.className = 'user-card';
            card.id = 'user-' + id;
            
            // Eğer başkasıysa ses çubuğu ekle, bensem "SEN" yaz
            let sliderHTML = '';
            if(!isMe) {
                sliderHTML = `
                    <div class="volume-box">
                        <span>SES SEVİYESİ</span>
                        <input type="range" min="0" max="1" step="0.1" value="1" oninput="changeUserVolume('${id}', this.value)">
                    </div>
                `;
            } else {
                sliderHTML = `<div style="color: #00ffff; font-size: 0.9rem; margin-top: 15px;">(SEN)</div>`;
            }

            card.innerHTML = `
                <div class="user-name">${name || "Bilinmeyen"}</div>
                ${sliderHTML}
            `;
            
            document.getElementById('participants-list').appendChild(card);
        }

        // Başkasının Sesini Kısma / Açma
        function changeUserVolume(userId, volumeLevel) {
            if(api) {
                api.executeCommand('setParticipantVolume', userId, parseFloat(volumeLevel));
            }
        }

        // Kendi Mikrofonunu Kapat/Aç
        function toggleMyMicrophone() {
            if(api) {
                api.executeCommand('toggleAudio');
                isMyMicMuted = !isMyMicMuted;
                const btn = document.getElementById('muteBtn');
                
                if(isMyMicMuted) {
                    btn.innerText = "MİKROFONU AÇ";
                    btn.style.color = "#00ff66";
                    btn.style.borderColor = "#00ff66";
                } else {
                    btn.innerText = "MİKROFONU KAPAT";
                    btn.style.color = "#ff3333";
                    btn.style.borderColor = "#ff3333";
                }
            }
        }
    </script>
</body>
</html>
