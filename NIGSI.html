<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGSI - Saf Ses Ağı</title>
    <!-- Doğrudan bağlantı için PeerJS kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* LOGO VE BAŞLIK */
        .header { margin-top: 40px; text-align: center; }
        .logo {
            font-size: 3.5rem; color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            letter-spacing: 10px; font-weight: bold; margin: 0;
        }
        .subtitle { color: #555; letter-spacing: 3px; font-size: 1rem; margin-top: 5px; }

        /* GİRİŞ EKRANI */
        #login-screen {
            background: rgba(15, 15, 15, 0.9);
            padding: 30px; border-radius: 10px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            text-align: center; width: 280px; margin-top: 50px;
        }

        input {
            width: 90%; padding: 12px; margin: 10px 0;
            background: #000; border: 1px solid #333;
            color: #00ffff; font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem; text-align: center;
            border-radius: 5px; outline: none;
        }
        input:focus { border-color: #00ffff; box-shadow: 0 0 8px rgba(0,255,255,0.3); }

        .btn {
            background: #000; color: #00ffff;
            border: 1px solid #00ffff; padding: 12px;
            margin-top: 15px; font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem; font-weight: bold;
            cursor: pointer; border-radius: 5px;
            width: 100%; transition: 0.3s;
        }
        .btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 15px #00ffff; }
        #error-msg { color: #ff3333; display: none; margin-top: 10px; font-weight: bold; }

        /* ODA EKRANI */
        #room-screen { display: none; flex-direction: column; align-items: center; width: 100%; margin-top: 30px; }
        
        .status-text { color: #00ffff; font-size: 1.2rem; margin-bottom: 20px; }

        .grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
            max-width: 900px; width: 100%; padding: 0 20px;
        }

        /* KULLANICI KARTLARI (Baştan Yazıldı) */
        .user-card {
            background: #0a0a0a; border: 2px solid #222;
            padding: 20px; border-radius: 8px; width: 150px;
            text-align: center; transition: 0.2s; position: relative;
        }

        /* PARLAMA EFEKTİ (Konuşurken aktif olur) */
        .user-card.speaking {
            border-color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            transform: scale(1.05);
        }
        .user-card.speaking .user-name { color: #00ff66; text-shadow: 0 0 10px #00ff66; }

        .user-card.me { border-color: #00ffff; }
        .user-card.me .user-name { color: #00ffff; }
        .user-card.me.speaking { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); }

        .user-name { font-size: 1.3rem; font-weight: bold; color: #ddd; margin-bottom: 15px; word-break: break-all; transition: 0.2s;}
        
        /* SES ÇUBUĞU */
        .vol-box { margin-top: 10px; }
        .vol-box label { display: block; font-size: 0.8rem; color: #777; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: #00ffff; cursor: pointer; }

        .controls { margin-top: 40px; display: flex; gap: 15px; }
        .btn-mute { color: #ff3333; border-color: #ff3333; width: auto; padding: 10px 20px; }
        .btn-mute:hover { background: #ff3333; color: #fff; box-shadow: none; }
        .btn-leave { color: #777; border-color: #777; width: auto; padding: 10px 20px; }
        .btn-leave:hover { background: #777; color: #fff; box-shadow: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="logo">NIGSI</h1>
        <div class="subtitle">KESİNTİSİZ İLETİŞİM AĞI</div>
    </div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <input type="text" id="username" placeholder="Takma İsim" maxlength="12" autocomplete="off">
        <input type="password" id="password" placeholder="Ağ Şifresi">
        <button class="btn" onclick="startSystem()">SİSTEME GİR</button>
        <p id="error-msg">Şifre Yanlış!</p>
    </div>

    <!-- SOHBET EKRANI -->
    <div id="room-screen">
        <div class="status-text" id="status-info">Ağa Bağlanılıyor... (Mikrofon İzni Verin)</div>
        
        <div class="grid" id="users-grid">
            <!-- Kişi Kartları Buraya Gelecek -->
        </div>

        <div class="controls">
            <button class="btn btn-mute" id="mute-btn" onclick="toggleMute()">MİKROFONU KAPAT</button>
            <button class="btn btn-leave" onclick="location.reload()">AĞDAN ÇIK</button>
        </div>
    </div>

    <script>
        const ODA_SIFRESI = "nigıbigı30";
        const ODA_PREFIX = "nigsi-revere-slot-";
        
        let localStream = null;
        let peer = null;
        let mySlot = 0;
        let myName = "";
        let audioContext = null;

        async function startSystem() {
            myName = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;

            if (pass !== ODA_SIFRESI) {
                document.getElementById("error-msg").style.display = "block";
                return;
            }
            if (!myName) return alert("Lütfen bir isim girin!");

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("room-screen").style.display = "flex";

            try {
                // MİKROFON İZNİ İSTE
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // SES ANALİZ MOTORUNU BAŞLAT (Parlamalar için)
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.resume(); // Tarayıcı politikasını aşmak için butona basınca başlatılır

                // Kendimizi sisteme bağlayalım (1'den 5'e kadar boş koltuk arar)
                connectToFreeSlot(1);

            } catch (err) {
                document.getElementById("status-info").innerText = "HATA: Mikrofon izni reddedildi veya bulunamadı!";
                document.getElementById("status-info").style.color = "#ff3333";
            }
        }

        // BOŞ BİR SLOT BUL VE YERLEŞ (Maksimum 5 Kişi)
        function connectToFreeSlot(slotNum) {
            if (slotNum > 5) {
                document.getElementById("status-info").innerText = "HATA: Ağ Dolu! (Maksimum 5 Kişi)";
                document.getElementById("status-info").style.color = "#ff3333";
                return;
            }

            const myId = ODA_PREFIX + slotNum;
            const tempPeer = new Peer(myId);

            tempPeer.on('open', (id) => {
                // Başarılı! Bu koltuğa oturduk.
                peer = tempPeer;
                mySlot = slotNum;
                document.getElementById("status-info").innerText = "AĞA BAĞLANDINIZ";
                setTimeout(() => { document.getElementById("status-info").style.display = "none"; }, 2000);
                
                // Kendi kartımızı ekranda oluşturalım
                createCard(myId, myName, true);
                analyzeMyVoice(myId, localStream);

                // Odadaki DİĞER slotları (kişileri) aramaya başla
                callOtherSlots();
                listenForIncomingConnections();
            });

            tempPeer.on('error', (err) => {
                // Eğer ID doluysa (biri oturuyorsa) bir sonraki koltuğa geç
                if (err.type === 'unavailable-id') {
                    connectToFreeSlot(slotNum + 1);
                } else {
                    console.error("PeerJS Hatası:", err);
                }
            });
        }

        // GELEN ARAMALARI DİNLE
        function listenForIncomingConnections() {
            // Biri bizi sesli aradığında:
            peer.on('call', (call) => {
                call.answer(localStream); // Kendi sesimizle cevap veriyoruz
                
                call.on('stream', (remoteStream) => {
                    handleRemoteUser(call.peer, remoteStream);
                });
            });

            // Biri ismini gönderdiğinde:
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'name_update') {
                        updateCardName(conn.peer, data.name);
                    }
                });
                // Karşılık olarak kendi ismimizi gönderelim
                conn.on('open', () => {
                    conn.send({ type: 'name_update', name: myName });
                });
            });
        }

        // DİĞER KOLTUKLARDAKİLERİ ARA
        function callOtherSlots() {
            for (let i = 1; i <= 5; i++) {
                if (i === mySlot) continue; // Kendimizi aramayalım
                
                const targetId = ODA_PREFIX + i;
                
                // 1. Sesli Arama Yap
                const call = peer.call(targetId, localStream);
                if (call) {
                    call.on('stream', (remoteStream) => {
                        handleRemoteUser(targetId, remoteStream);
                    });
                }

                // 2. İsmimizi Gönder
                const conn = peer.connect(targetId);
                if (conn) {
                    conn.on('open', () => {
                        conn.send({ type: 'name_update', name: myName });
                    });
                    conn.on('data', (data) => {
                        if (data.type === 'name_update') {
                            updateCardName(targetId, data.name);
                        }
                    });
                }
            }
        }

        // KARŞI TARAFTAN SES GELDİĞİNDE
        function handleRemoteUser(userId, stream) {
            // Zaten varsa ekleme
            if(document.getElementById('audio-' + userId)) return; 

            // Sesi oynatmak için HTML'e gizli bir audio etiketi ekle
            const audioEl = document.createElement('audio');
            audioEl.id = 'audio-' + userId;
            audioEl.srcObject = stream;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);

            // Ekrana kartını çiz (İsmi veri kanalından gelene kadar Bekleniyor yazar)
            createCard(userId, "Bağlanıyor...", false);

            // Konuşma parlaklık animasyonu için analiz başlat
            analyzeRemoteVoice(userId, stream);
        }

        // EKRANA KİŞİ KARTI ÇİZME
        function createCard(userId, name, isMe) {
            if(document.getElementById('card-' + userId)) return;

            const grid = document.getElementById('users-grid');
            const card = document.createElement('div');
            card.className = `user-card ${isMe ? 'me' : ''}`;
            card.id = `card-${userId}`;

            let volumeControl = '';
            if (!isMe) {
                // Başkasıysa Ses Ayar Çubuğu Ekle
                volumeControl = `
                    <div class="vol-box">
                        <label>SES KONTROLÜ</label>
                        <input type="range" min="0" max="1" step="0.1" value="1" oninput="changeVol('${userId}', this.value)">
                    </div>
                `;
            } else {
                volumeControl = `<div style="color:#00ffff; font-size:0.9rem; margin-top:10px;">(SEN)</div>`;
            }

            card.innerHTML = `
                <div class="user-name" id="name-${userId}">${name}</div>
                ${volumeControl}
            `;
            grid.appendChild(card);
        }

        // İSİM GÜNCELLEME
        function updateCardName(userId, name) {
            const nameEl = document.getElementById(`name-${userId}`);
            if (nameEl) nameEl.innerText = name;
        }

        // SES KISMA (BAŞKASININ SESİNİ)
        function changeVol(userId, val) {
            const audioEl = document.getElementById(`audio-${userId}`);
            if (audioEl) audioEl.volume = parseFloat(val);
        }

        // KENDİ MİKROFONUNU KAPATMA
        function toggleMute() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled; // Aç/Kapat

                const btn = document.getElementById('mute-btn');
                if (audioTrack.enabled) {
                    btn.innerText = "MİKROFONU KAPAT";
                    btn.style.color = "#ff3333";
                    btn.style.borderColor = "#ff3333";
                } else {
                    btn.innerText = "MİKROFONU AÇ";
                    btn.style.color = "#777";
                    btn.style.borderColor = "#777";
                    
                    // Sustuğumuzda parlaklığın kesin gitmesi için
                    document.getElementById(`card-${ODA_PREFIX}${mySlot}`).classList.remove('speaking');
                }
            }
        }

        // *** SES ANALİZİ VE PARLAMA SİSTEMİ (GERÇEK ZAMANLI) ***
        function analyzeRemoteVoice(userId, stream) {
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            source.connect(analyser);
            analyser.fftSize = 256;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkVolume() {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let avg = sum / dataArray.length;

                const card = document.getElementById(`card-${userId}`);
                if (card) {
                    // Eğer ortalama ses seviyesi 10'dan büyükse kişi konuşuyor demektir
                    if (avg > 10) card.classList.add('speaking');
                    else card.classList.remove('speaking');
                }
                requestAnimationFrame(checkVolume);
            }
            checkVolume();
        }

        // KENDİ SESİMİZİN PARLAMASI
        function analyzeMyVoice(myId, stream) {
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            source.connect(analyser);
            analyser.fftSize = 256;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function checkVolume() {
                // Eğer mikrofon kapalıysa hiç analiz etme
                if(localStream && !localStream.getAudioTracks()[0].enabled) {
                    requestAnimationFrame(checkVolume);
                    return;
                }

                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let avg = sum / dataArray.length;

                const card = document.getElementById(`card-${myId}`);
                if (card) {
                    if (avg > 10) card.classList.add('speaking');
                    else card.classList.remove('speaking');
                }
                requestAnimationFrame(checkVolume);
            }
            checkVolume();
        }
    </script>
</body>
</html>
