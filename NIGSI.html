<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGSI - Crimson Command Center</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --neon-red: #ff1a1a;
            --dark-red: #2a0000;
            --bg-dark: #0a0a0a;
            --bg-panel: #111111;
            --border-color: #330d0d;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark); color: var(--text-main); font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-red); }

        #login-screen {
            background: var(--bg-panel); border: 1px solid var(--border-color); padding: 40px; 
            border-radius: 12px; text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--neon-red); margin: 0 0 5px 0; letter-spacing: 8px; text-shadow: 0 0 10px rgba(255,26,26,0.5); }
        .sub-logo { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; }
        
        input.styled-input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: #050505; border: 1px solid var(--border-color);
            color: var(--neon-red); font-family: 'Orbitron', sans-serif; text-align: center; border-radius: 6px; outline: none; transition: 0.3s;
        }
        input.styled-input:focus { border-color: var(--neon-red); box-shadow: 0 0 10px rgba(255,26,26,0.2); }
        
        .btn {
            background: var(--dark-red); color: #fff; border: 1px solid var(--neon-red); padding: 12px; width: 100%;
            font-family: 'Orbitron', sans-serif; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .btn:hover { background: var(--neon-red); color: #000; box-shadow: 0 0 15px rgba(255,26,26,0.4); }
        #error-msg { color: var(--neon-red); display: none; margin-top: 15px; font-weight: bold; font-size: 0.9rem;}

        #app-screen { display: none; width: 100%; height: 100vh; background: var(--bg-dark); }
        
        #sidebar {
            width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; height: 100%;
        }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .sidebar-header .logo { font-size: 2rem; letter-spacing: 5px; }
        
        #users-list { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .user-item {
            background: #050505; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; transition: 0.3s; position: relative;
        }
        .user-item.me { border-color: rgba(255,26,26,0.4); }
        
        /* EMRAN YETKİSİ: ATMA BUTONU */
        .kick-btn {
            position: absolute; top: 5px; right: 5px; background: transparent; border: none; 
            color: var(--neon-red); cursor: pointer; font-size: 0.9rem; transition: 0.2s; opacity: 0.5;
        }
        .kick-btn:hover { opacity: 1; transform: scale(1.2); }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 35px; height: 35px; background: var(--bg-dark); border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-family: 'Orbitron', sans-serif; color: var(--text-muted); border: 1px solid #333; transition: 0.3s;
        }
        .user-name { font-weight: bold; font-size: 1.1rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .afk-badge { display: none; background: #333; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold;}
        .user-item.afk { opacity: 0.4; filter: grayscale(100%); }
        .user-item.afk .afk-badge { display: inline-block; }
        
        @keyframes pulseAudio { 0% { box-shadow: 0 0 0 0 rgba(255, 26, 26, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(255, 26, 26, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 26, 26, 0); } }
        .user-item.speaking .avatar { border-color: var(--neon-red); color: var(--neon-red); animation: pulseAudio 1s infinite; }
        
        .vol-slider { -webkit-appearance: none; width: 100%; height: 2px; background: #333; outline: none; margin-top: 10px; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--neon-red); cursor: pointer; }

        #my-controls {
            padding: 15px; border-top: 1px solid var(--border-color); background: #080808;
            display: flex; justify-content: space-between; gap: 5px;
        }
        .ctrl-btn {
            flex: 1; background: #111; border: 1px solid #333; color: var(--text-muted); padding: 10px 0;
            border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .ctrl-btn:hover { background: #222; color: #fff; }
        .ctrl-btn.active-red { color: var(--neon-red); border-color: var(--neon-red); background: rgba(255,26,26,0.1); }
        .ctrl-btn.active-blue { color: #00ffff; border-color: #00ffff; background: rgba(0,255,255,0.1); }

        #main-area { flex: 1; display: flex; flex-direction: column; background: #050505; }
        
        #screen-view-container {
            display: none; background: #000; border-bottom: 1px solid var(--border-color);
            padding: 20px; align-items: center; justify-content: center; height: 60%;
        }
        #shared-screen { max-width: 100%; max-height: 100%; border: 1px solid var(--neon-red); border-radius: 8px; box-shadow: 0 0 20px rgba(255,26,26,0.2); }

        #chat-section { flex: 1; display: flex; flex-direction: column; padding: 20px; min-height: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .chat-msg { background: var(--bg-panel); border: 1px solid #1a1a1a; padding: 10px 15px; border-radius: 8px; font-size: 1.05rem; }
        .chat-name { font-weight: bold; color: #aaa; margin-right: 5px; font-size: 0.95rem; text-transform: uppercase; }
        .chat-name.me { color: var(--neon-red); }
        .chat-img { max-width: 250px; border-radius: 6px; margin-top: 8px; border: 1px solid #333; }

        #chat-input-area { display: flex; gap: 10px; margin-top: 15px; background: var(--bg-panel); padding: 5px; border-radius: 8px; border: 1px solid var(--border-color); }
        #chat-input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-family: 'Rajdhani', sans-serif; font-size: 1.05rem; outline: none; }
        .action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 0 15px; font-size: 1.2rem; transition: 0.2s;}
        .action-btn:hover { color: var(--neon-red); }
        .action-btn.send { color: var(--neon-red); font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 1rem;}
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 class="logo">NIGSI</h1>
        <div class="sub-logo">Crimson Terminal</div>
        <input type="text" id="username" class="styled-input" placeholder="Operatör Adı" maxlength="12" autocomplete="off">
        <input type="password" id="password" class="styled-input" placeholder="Ağ Şifresi">
        <button class="btn" onclick="startSystem()">BAĞLAN</button>
        <p id="error-msg">Yetkisiz Erişim!</p>
    </div>

    <div id="app-screen">
        <div id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo" style="font-size: 2rem;">NIGSI</h1>
            </div>
            
            <div id="users-list"></div>

            <div id="my-controls">
                <button class="ctrl-btn" id="mic-btn" onclick="toggleMute()" title="Mikrofonu Kapat/Aç">🎤</button>
                <button class="ctrl-btn" id="afk-btn" onclick="toggleAFK()" title="AFK Modu (Sustur)">💤</button>
                <button class="ctrl-btn" id="screen-btn" onclick="toggleScreenShare()" title="Ekran Paylaş">📺</button>
                <button class="ctrl-btn" onclick="location.reload()" title="Ağdan Çık">🚪</button>
            </div>
        </div>

        <div id="main-area">
            <div id="screen-view-container">
                <video id="shared-screen" autoplay playsinline></video>
            </div>

            <div id="chat-section">
                <div id="chat-box"></div>
                <div id="chat-input-area">
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                    <button class="action-btn" onclick="document.getElementById('image-input').click()" title="Resim Gönder">🖼️</button>
                    <input type="text" id="chat-input" placeholder="Veri ağına mesaj gir..." onkeypress="handleEnter(event)">
                    <button class="action-btn send" onclick="sendChatMessage()">GÖNDER</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ODA_SIFRESI = "nigıbigı30";
        const ODA_PREFIX = "nigsi-revere-slot-";
        
        let localStream = null;
        let screenStream = null;
        let peer = null;
        let mySlot = 0;
        let myName = "";
        let audioContext = null;
        let dataConnections = {}; 
        let isAFK = false;
        let isMuted = false;
        let screenCalls = [];

        // --- ÇİFT SEKMEYİ ENGELLEME SİSTEMİ (Anti-Ghosting) ---
        const tabLockChannel = new BroadcastChannel('nigsi_tab_lock');
        let isActiveInThisTab = false; // Sadece odaya bağlanan sekme "Ben buradayım" der
        
        tabLockChannel.onmessage = (e) => {
            if (e.data === 'ping' && isActiveInThisTab) tabLockChannel.postMessage('pong');
            if (e.data === 'pong') window.anotherTabIsActive = true;
        };
        // Sayfa açıldığında diğer sekmelere "Açık mısınız?" diye sor
        tabLockChannel.postMessage('ping');

        window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });

        function playSfx(type) {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain); gain.connect(audioContext.destination);
            const now = audioContext.currentTime;
            
            if (type === 'join') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'leave') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'msg') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        async function startSystem() {
            // ÇİFT GİRİŞ KONTROLÜ
            if (window.anotherTabIsActive) {
                alert("GÜVENLİK REDDİ: Sistem zaten bu cihazda başka bir sekmede aktif. Çift giriş yapılamaz.");
                return;
            }

            myName = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;

            if (pass !== ODA_SIFRESI) { document.getElementById("error-msg").style.display = "block"; return; }
            if (!myName) return alert("Lütfen bir isim girin!");

            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "flex";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.resume();
                connectToFreeSlot(1);
            } catch (err) { alert("Mikrofon izni reddedildi!"); location.reload(); }
        }

        function connectToFreeSlot(slotNum) {
            if (slotNum > 5) return alert("Ağ Dolu! (Maks. 5 Kişi)");

            const myId = ODA_PREFIX + slotNum;
            const tempPeer = new Peer(myId);

            tempPeer.on('open', (id) => {
                peer = tempPeer; mySlot = slotNum;
                isActiveInThisTab = true; // Sisteme başarıyla giriş yaptık, diğer sekmeleri engelle
                
                createCard(myId, myName, true);
                analyzeMyVoice(myId, localStream);
                callOtherSlots();
                listenForIncomingConnections();
                playSfx('join');
            });

            tempPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') connectToFreeSlot(slotNum + 1);
            });
        }

        function listenForIncomingConnections() {
            peer.on('call', (call) => {
                if (call.metadata && call.metadata.isScreen) {
                    call.answer();
                    call.on('stream', remoteStream => {
                        document.getElementById('shared-screen').srcObject = remoteStream;
                        document.getElementById('screen-view-container').style.display = 'flex';
                    });
                    call.on('close', () => { document.getElementById('screen-view-container').style.display = 'none'; });
                } else {
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => { handleRemoteUser(call.peer, remoteStream); });
                    call.on('close', () => removeUser(call.peer));
                }
            });

            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    dataConnections[conn.peer] = conn;
                    conn.send({ type: 'name_update', name: myName, afk: isAFK });
                });
                
                conn.on('data', (data) => {
                    confirmConnection(conn.peer, data.name);
                    
                    if (data.type === 'name_update') {
                        updateCardName(conn.peer, data.name);
                        updateAFKUI(conn.peer, data.afk);
                    } else if (data.type === 'chat') {
                        displayChatMessage(data.name, data.message, false);
                    } else if (data.type === 'image') {
                        displayImageMessage(data.name, data.image, false);
                    } else if (data.type === 'afk_status') {
                        updateAFKUI(conn.peer, data.status);
                    } else if (data.type === 'kick_user') {
                        // BİRİSİ ATILDIĞINDA DEVREYE GİREN KOD
                        if (data.target === (ODA_PREFIX + mySlot)) {
                            // Atılan kişi BİZ isek verileri yok edip sistemi kapat
                            isActiveInThisTab = false;
                            if (peer) peer.destroy();
                            alert("YÖNETİCİ MÜDAHALESİ: Sunucudan atıldınız.");
                            location.reload();
                        } else {
                            // Atılan kişi başkasıysa onu listeden sil (Ekranı temizle)
                            removeUser(data.target);
                        }
                    }
                });

                conn.on('close', () => { delete dataConnections[conn.peer]; removeUser(conn.peer); });
            });
        }

        function callOtherSlots() {
            for (let i = 1; i <= 5; i++) {
                if (i === mySlot) continue;
                const targetId = ODA_PREFIX + i;
                
                const call = peer.call(targetId, localStream);
                if (call) {
                    call.on('stream', (remoteStream) => handleRemoteUser(targetId, remoteStream));
                    call.on('close', () => removeUser(targetId));
                }

                const conn = peer.connect(targetId);
                if (conn) {
                    conn.on('open', () => {
                        dataConnections[targetId] = conn;
                        conn.send({ type: 'name_update', name: myName, afk: isAFK });
                    });
                    conn.on('data', (data) => {
                        confirmConnection(targetId, data.name);
                        if (data.type === 'name_update') { updateCardName(targetId, data.name); updateAFKUI(targetId, data.afk); }
                        else if (data.type === 'chat') displayChatMessage(targetId, data.message, false);
                        else if (data.type === 'image') displayImageMessage(targetId, data.image, false);
                        else if (data.type === 'afk_status') updateAFKUI(targetId, data.status);
                        else if (data.type === 'kick_user') {
                            if (data.target === (ODA_PREFIX + mySlot)) {
                                isActiveInThisTab = false; if (peer) peer.destroy(); alert("YÖNETİCİ MÜDAHALESİ: Sunucudan atıldınız."); location.reload();
                            } else { removeUser(data.target); }
                        }
                    });
                    conn.on('close', () => { delete dataConnections[targetId]; removeUser(targetId); });
                }
            }
        }

        // --- YÖNETİCİ (EMRAN) ATMA FONKSİYONU ---
        function kickUser(userId) {
            if (confirm("Kullanıcıyı ağdan uzaklaştırmak istiyor musunuz?")) {
                broadcastData({ type: 'kick_user', target: userId }); // Herkese bu kişiyi atmasını söyle
                setTimeout(() => removeUser(userId), 500); // Kendi ekranımızdan da anında silelim
            }
        }

        async function toggleScreenShare() {
            const btn = document.getElementById('screen-btn');
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
                document.getElementById('screen-view-container').style.display = 'none';
                screenCalls.forEach(call => call.close());
                screenCalls = [];
                btn.classList.remove('active-blue');
                return;
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({video: true, audio: true});
                document.getElementById('shared-screen').srcObject = screenStream;
                document.getElementById('screen-view-container').style.display = 'flex';
                btn.classList.add('active-blue');
                for (let i = 1; i <= 5; i++) {
                    if (i === mySlot) continue;
                    const call = peer.call(ODA_PREFIX + i, screenStream, { metadata: { isScreen: true } });
                    if(call) screenCalls.push(call);
                }
                screenStream.getVideoTracks()[0].onended = () => toggleScreenShare();
            } catch(err) {}
        }

        function toggleAFK() {
            isAFK = !isAFK;
            const btn = document.getElementById('afk-btn');
            const myCard = document.getElementById(`card-${ODA_PREFIX}${mySlot}`);
            if (localStream && !isMuted) localStream.getAudioTracks()[0].enabled = !isAFK;
            document.querySelectorAll('audio').forEach(a => { a.muted = isAFK; });

            if (isAFK) { btn.classList.add('active-red'); if(myCard) myCard.classList.add('afk'); }
            else { btn.classList.remove('active-red'); if(myCard) myCard.classList.remove('afk'); }
            broadcastData({ type: 'afk_status', status: isAFK });
        }

        function updateAFKUI(userId, status) {
            const card = document.getElementById(`card-${userId}`);
            if(card) { if(status) card.classList.add('afk'); else card.classList.remove('afk'); }
        }

        function broadcastData(payload) {
            Object.values(dataConnections).forEach(conn => { if (conn && conn.open) conn.send(payload); });
        }

        function handleEnter(e) { if (e.key === 'Enter') sendChatMessage(); }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            displayChatMessage(myName, text, true);
            broadcastData({ type: 'chat', name: myName, message: text });
            input.value = "";
        }

        function displayChatMessage(senderName, messageText, isMe) {
            if(!isMe) playSfx('msg');
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-msg"><span class="chat-name ${isMe ? 'me' : ''}">${senderName}:</span> <span class="chat-text">${messageText}</span></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                displayImageMessage(myName, e.target.result, true);
                broadcastData({ type: 'image', name: myName, image: e.target.result });
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function displayImageMessage(senderName, imgData, isMe) {
            if(!isMe) playSfx('msg');
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-msg"><span class="chat-name ${isMe ? 'me' : ''}">${senderName}:</span><br><img src="${imgData}" class="chat-img"></div>`;
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 100);
        }

        function handleRemoteUser(userId, stream) {
            removeUser(userId);
            const audioEl = document.createElement('audio');
            audioEl.id = 'audio-' + userId; audioEl.srcObject = stream; audioEl.autoplay = true;
            if(isAFK) audioEl.muted = true;
            document.body.appendChild(audioEl);
            
            createCard(userId, "Bağlanıyor...", false);
            analyzeRemoteVoice(userId, stream);
            playSfx('join');

            setTimeout(() => {
                const nameEl = document.getElementById(`name-${userId}`);
                if (nameEl && nameEl.innerText === "Bağlanıyor...") removeUser(userId);
            }, 3000);
        }

        function removeUser(userId) {
            const oldAudio = document.getElementById('audio-' + userId); if (oldAudio) oldAudio.remove();
            const oldCard = document.getElementById('card-' + userId); 
            if (oldCard) { oldCard.remove(); playSfx('leave'); }
        }

        function confirmConnection(userId, realName) {
            if (realName) updateCardName(userId, realName);
        }

        function createCard(userId, name, isMe) {
            if(document.getElementById('card-' + userId)) return;
            const list = document.getElementById('users-list');
            
            // YÖNETİCİ KONTROLÜ (İsim emran ise diğerlerine atma butonu koy)
            let kickBtnHTML = '';
            if (myName.toLowerCase() === 'emran' && !isMe) {
                kickBtnHTML = `<button class="kick-btn" onclick="kickUser('${userId}')" title="Ağdan Uzaklaştır">❌</button>`;
            }

            let html = `
                <div class="user-item ${isMe ? 'me' : ''}" id="card-${userId}">
                    ${kickBtnHTML}
                    <div class="user-info">
                        <div class="avatar" id="avatar-${userId}">${name.charAt(0).toUpperCase()}</div>
                        <div class="user-name" id="name-${userId}">${name}</div>
                        <div class="afk-badge">AFK</div>
                    </div>
            `;
            if (!isMe) {
                html += `<input type="range" class="vol-slider" min="0" max="1" step="0.1" value="1" oninput="changeVol('${userId}', this.value)" title="Ses Düzeyi">`;
            }
            html += `</div>`;
            list.innerHTML += html;
        }

        function updateCardName(userId, name) {
            const n = document.getElementById(`name-${userId}`); const a = document.getElementById(`avatar-${userId}`);
            if (n) n.innerText = name; if (a) a.innerText = name.charAt(0).toUpperCase();
        }

        function changeVol(userId, val) {
            const a = document.getElementById(`audio-${userId}`); if (a && !isAFK) a.volume = parseFloat(val);
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('mic-btn');
            if (localStream && !isAFK) localStream.getAudioTracks()[0].enabled = !isMuted;
            if (isMuted) btn.classList.add('active-red'); else btn.classList.remove('active-red');
        }

        function analyzeRemoteVoice(userId, stream) {
            const src = audioContext.createMediaStreamSource(stream); const anl = audioContext.createAnalyser();
            src.connect(anl); anl.fftSize = 256; const data = new Uint8Array(anl.frequencyBinCount);
            function check() {
                if(!document.getElementById(`card-${userId}`)) return;
                anl.getByteFrequencyData(data);
                let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                let avg = sum / data.length;
                const card = document.getElementById(`card-${userId}`);
                if (card && !card.classList.contains('afk')) {
                    if (avg > 10) card.classList.add('speaking'); else card.classList.remove('speaking');
                }
                requestAnimationFrame(check);
            }
            check();
        }

        function analyzeMyVoice(myId, stream) {
            const src = audioContext.createMediaStreamSource(stream); const anl = audioContext.createAnalyser();
            src.connect(anl); anl.fftSize = 256; const data = new Uint8Array(anl.frequencyBinCount);
            function check() {
                if(localStream && !localStream.getAudioTracks()[0].enabled) {
                    const card = document.getElementById(`card-${myId}`);
                    if(card) card.classList.remove('speaking');
                    requestAnimationFrame(check); return;
                }
                anl.getByteFrequencyData(data);
                let sum = 0; for(let i=0; i<data.length; i++) sum += data[i];
                let avg = sum / data.length;
                const card = document.getElementById(`card-${myId}`);
                if (card && !card.classList.contains('afk')) {
                    if (avg > 10) card.classList.add('speaking'); else card.classList.remove('speaking');
                }
                requestAnimationFrame(check);
            }
            check();
        }
    </script>
</body>
